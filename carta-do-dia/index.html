se has concealed.","Some cycles change without asking your permission.","Strength shows in how you respond, not how loudly you speak.","Perhaps this needs a different perspective.","Letting something end does not make it meaningless.","Balance is built through small, repeated choices.","What attracts you deserves scrutiny too.","What once felt solid may need rebuilding.","There are still reasons to believe in what you are building.","Not everything you feel is proof of what you fear.","You need not dim your light to keep others comfortable.","Old decisions sometimes require a new answer.","Acknowledge how far you have come before demanding another finish line.","An idea only comes alive when you make room to begin.","You can want progress and still need to choose a direction.","The future is not built by imagining possibilities alone.","Stability need not become routine.","The difference between conflict and growth may be how you listen.","Some achievements deserve recognition without false modesty.","Defending your place does not require attacking anyone else's.","Movement can begin before you feel completely ready.","Persistence is not the same as ignoring exhaustion.","You do not have to keep carrying everything you can carry.","Curiosity can take you further than fear of mistakes.","Rushing change can hide what it has to teach.","Confidence grows when you own your choices.","Leadership also means knowing when not to control.","Allow yourself to receive what you usually give.","A connection deserves reciprocity, not just hope.","Shared joy needs no justification.","Dissatisfaction may conceal a need you have not named.","Loss deserves space, but it need not occupy your future.","Some memories can comfort without being repeated.","Not every possibility deserves your energy.","Walking away can bring you closer to yourself.","Getting what you want does not resolve every inner need.","Harmony takes presence, not appearances.","A new feeling does not require an immediate answer.","Listen to your feelings without letting them decide everything.","Sensitivity is strength when you do not erase yourself.","Caring for someone does not mean deciding for them.","A clear idea can cut through confusion.","Delaying a choice is also a choice.","Some truths hurt before they set you free.","Rest is not giving up on what matters.","Not every argument needs a winner.","What drove you away may show you where to go.","Question solutions that require hiding the truth.","When everything feels closed, look for what you can still change.","Anxiety tells stories that do not always come true.","A conflict can end when you stop feeding it.","Ask questions before turning suspicion into certainty.","A fast answer is not necessarily a fair one.","Clarity takes courage and respect.","Authority loses value when it stops listening.","A real opportunity deserves more than passing enthusiasm.","Balancing priorities means accepting that one day cannot hold everything.","What you build together also depends on trust.","Security should not become a comfortable prison.","What you lack does not define all that you have.","Notice those who shared your achievements.","Progress is not always visible while it happens.","Careful work matters more than looking finished.","You have come further than exhaustion lets you see.","Abundance makes sense when you know what is enough.","A small offer may open an important lesson.","Reality deserves more commitment than beautiful promises.","Your worth does not depend on constant availability.","Building something lasting takes choices beyond initial excitement."],"es":["No todos los saltos necesitan garantías; algunos empiezan cuando confías en ti.","Tienes más recursos de los que estás utilizando.","La respuesta puede aparecer cuando escuchas antes de actuar.","Lo que cuidas tiene más posibilidades de crecer.","Poner límites también protege lo que importa.","No todas las reglas que sigues siguen teniendo sentido.","Elegir implic const day=[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-');let seed=0;const key='maison-card-seed';try{seed=Number(localStorage.getItem(key));if(!seed){seed=Math.floor(Math.random()*1000000)+1;localStorage.setItem(key,String(seed));}}catch{const bytes=new Uint32Array(1);if(globalThis.crypto?.getRandomValues){crypto.getRandomValues(bytes);seed=bytes[0]||1;}else seed=Math.floor(Math.random()*1000000)+1;}
let hash=2166136261;for(const c of day+seed){hash^=c.charCodeAt(0);hash=Math.imul(hash,16777619);}const index=(hash>>>0)%78;
let lang=navigator.language in I?navigator.language:'pt-PT';const sel=document.getElementById('lang');sel.value=lang;
function render(){lang=sel.value;const sq=document.getElementById('saveSquare');if(sq)sq.textContent=({'pt-PT':'Guardar quadrado','pt-BR':'Salvar quadrado',en:'Save square',es:'Guardar cuadrado'})[lang];document.documentElement.lang=lang;const d=I[lang];for(const k of ['heading','intro','label','angelHeading','angelNotice','share','save','disclaimer','home'])document.getElementById(k).textContent=d[k];document.getElementById('card').textContent=cardName(index,lang);document.getElementById('quote').textContent='«'+TAROT_MESSAGES[lang][index]+'»';const au=ANGEL_UI[lang];document.getElementById('angelNotice').textContent=todayAngel.angel.name+' · '+au.attrs+': '+(ANGEL_ATTR_TRANSLATIONS[lang]?.[todayAngel.index]||todayAngel.angel.attribute)+' · '+au.hour+': '+angelTime(todayAngel.index)+'. '+au.note;}sel.addEventListener('change',render);render();
function canvas(format='story'){
 const c=document.createElement('canvas');c.width=1080;c.height=format==='square'?1080:1920;
 const x=c.getContext('2d'),H=c.height;x.fillStyle='#100e0b';x.fillRect(0,0,1080,H);
 x.strokeStyle='#a88b59';x.lineWidth=3;x.strokeRect(60,60,960,H-120);x.textAlign='center';
 x.fillStyle='#d6ba86';x.font='42px Georgia';x.fillText('MAISON JF®',540,170);
 x.font='27px Georgia';x.fillText(I[lang].label.toUpperCase(),540,H*.27);
 x.fillStyle='#f1ece3';x.font='bold 55px Georgia';x.fillText(cardName(index,lang),540,H*.39,900);
 x.font='41px Georgia';const message=TAROT_MESSAGES[lang][index],words=message.split(' ');let lines=[],line='';
 for(const w of words){const trial=line?line+' '+w:w;if(x.measureText(trial).width>840){if(line)lines.push(line);line=w;}else line=trial;}if(line)lines.push(line);
 const start=H*.52-(lines.length-1)*26;lines.forEach((t,i)=>x.fillText(t,540,start+i*60));
 x.fillStyle='#d6ba86';x.font='29px Georgia';x.fillText(I[lang].angelHeading.toUpperCase()+': '+todayAngel.angel.name,540,H*.75,900);
 x.font='26px Georgia';x.fillText(ANGEL_UI[lang].hour+': '+angelTime(todayAngel.index),540,H*.79,900);
 x.font='30px Georgia';x.fillText('maison-jf.com/carta-do-dia',540,H-155,930);return c;
}
function download(format){canvas(format).toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maison-jf-carta-do-dia-'+format+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);},'image/png');}
document.getElementById('save').onclick=()=>download('story');
const square=document.createElement('button');square.id='saveSquare';square.type='button';square.textContent=({ 'pt-PT':'Guardar quadrado', 'pt-BR':'Salvar quadrado', en:'Save square', es:'Guardar cuadrado' })[lang];document.querySelector('.actions').append(square);square.onclick=()=>download('square');
document.getElementById('share').onclick=()=>canvas('story').toBlob(async blob=>{
 if(!blob)return;const file=new File([blob],'maison-jf-carta-do-dia.png',{type:'image/png'});
 try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:I[lang].heading});
 else if(navigator.share)await navigator.share({title:I[lang].heading,url:location.href});
 else download('story');}catch(e){if(e.name!=='AbortError')download('story');}
},'image/png');
</script></body></html>
