const I={
'pt-PT':{heading:'A tua Carta do Dia',intro:'Uma carta. Uma frase. Um momento para ti.',label:'O teu arcano de hoje',angelHeading:'O anjo do dia',angelNotice:'O calendário dos 72 anjos e os horários tradicionais estão em validação. Não apresentamos associações ou horas sem confirmação.',share:'Partilhar',save:'Guardar cartão',disclaimer:'Leitura simbólica para reflexão. Não constitui previsão factual.',home:'Voltar à Maison',phrases:['Há uma escolha que continuas a adiar, mesmo sabendo o que ela exige.','Nem tudo o que te prende ainda merece a tua lealdade.','Aquilo que evitas reconhecer pode estar a influenciar mais do que imaginas.','Uma mudança começa quando deixas de negociar com o que já sabes.','Há respostas que só aparecem quando paras de procurar aprovação.','Nem toda a dúvida é falta de clareza; às vezes é receio de agir.','O que hoje parece pequeno pode revelar aquilo a que tens dado demasiado espaço.','Talvez estejas a exigir certezas onde basta uma decisão.']},
'pt-BR':{heading:'Sua Carta do Dia',intro:'Uma carta. Uma frase. Um momento para você.',label:'Seu arcano de hoje',angelHeading:'O anjo do dia',angelNotice:'O calendário dos 72 anjos e os horários tradicionais estão em validação. Não apresentamos associações ou horários sem confirmação.',share:'Compartilhar',save:'Salvar cartão',disclaimer:'Leitura simbólica para reflexão. Não é uma previsão factual.',home:'Voltar à Maison',phrases:['Existe uma escolha que você continua adiando, mesmo sabendo o que ela exige.','Nem tudo o que prende você ainda merece sua lealdade.','Aquilo que você evita reconhecer pode estar influenciando mais do que imagina.','Uma mudança começa quando você deixa de negociar com o que já sabe.','Existem respostas que só aparecem quando você para de buscar aprovação.','Nem toda dúvida é falta de clareza; às vezes é medo de agir.','O que hoje parece pequeno pode revelar aquilo a que você dá espaço demais.','Talvez você esteja exigindo certezas quando basta uma decisão.']},
'en':{heading:'Your Card of the Day',intro:'One card. One sentence. A moment for yourself.',label:'Your arcana today',angelHeading:'Angel of the day',angelNotice:'The calendar of 72 angels and traditional time windows are being verified. We will not display unverified names or times.',share:'Share',save:'Save card',disclaimer:'A symbolic reflection, not a factual prediction.',home:'Back to Maison',phrases:['There is a choice you keep postponing, even though you know what it asks of you.','Not everything holding you back still deserves your loyalty.','What you avoid acknowledging may shape more than you realise.','Change begins when you stop bargaining with what you already know.','Some answers only appear when you stop looking for permission.','Not every doubt means confusion; sometimes it means fear of acting.','What seems small today may reveal what you have given too much space.','Perhaps you are demanding certainty when a decision would be enough.']},
'es':{heading:'Tu Carta del Día',intro:'Una carta. Una frase. Un momento para ti.',label:'Tu arcano de hoy',angelHeading:'El ángel del día',angelNotice:'El calendario de los 72 ángeles y sus horarios tradicionales están en proceso de verificación. No mostramos nombres ni horas sin confirmar.',share:'Compartir',save:'Guardar tarjeta',disclaimer:'Lectura simbólica para reflexionar, no una predicción factual.',home:'Volver a Maison',phrases:['Hay una decisión que sigues aplazando, aunque sabes lo que exige de ti.','No todo lo que te retiene sigue mereciendo tu lealtad.','Lo que evitas reconocer puede influir más de lo que imaginas.','El cambio comienza cuando dejas de negociar con lo que ya sabes.','Algunas respuestas aparecen cuando dejas de buscar permiso.','No toda duda es confusión; a veces es miedo a actuar.','Lo que hoy parece pequeño puede revelar a qué das demasiado espacio.','Quizá estés exigiendo certezas cuando bastaría una decisión.']}};

function cardName(i,l){if(i<22)return (translations[l]||names)[i];if(l==='pt-PT'||l==='pt-BR')return names[i];let n=i-22;return ranks[l][n%14]+' '+(l==='en'?'of ':'de ')+suits[l][Math.floor(n/14)];}

const ANGELS=[{"name":"Vehuiah","start":"03-21","attribute":"Coragem e iniciativa"},{"name":"Jeliel","start":"03-26","attribute":"Reconciliação e afecto"},{"name":"Sitael","start":"03-31","attribute":"Protecção e responsabilidade"},{"name":"Elemiah","start":"04-05","attribute":"Discernimento e recomeço"},{"name":"Mahasiah","start":"04-10","attribute":"Aprendizagem e equilíbrio"},{"name":"Lelahel","start":"04-15","attribute":"Clareza e expressão"},{"name":"Achaiah","start":"04-21","attribute":"Paciência e descoberta"},{"name":"Cahetel","start":"04-26","attribute":"Gratidão e abundância"},{"name":"Haziel","start":"05-01","attribute":"Compaixão e perdão"},{"name":"Aladiah","start":"05-06","attribute":"Renovação e confiança"},{"name":"Lauviah","start":"05-11","attribute":"Amizade e lealdade"},{"name":"Hahaiah","start":"05-16","attribute":"Refúgio e sensibilidade"},{"name":"Iezalel","start":"05-21","attribute":"União e entendimento"},{"name":"Mebahel","start":"05-26","attribute":"Justiça e verdade"},{"name":"Hariel","start":"06-01","attribute":"Purificação e criatividade"},{"name":"Hekamiah","start":"06-06","attribute":"Coragem e liderança"},{"name":"Lauviah II","start":"06-11","attribute":"Intuição e serenidade"},{"name":"Caliel","start":"06-16","attribute":"Justiça e lucidez"},{"name":"Leuviah","start":"06-22","attribute":"Memória e inteligência"},{"name":"Pahaliah","start":"06-27","attribute":"Vocação e fé"},{"name":"Nelkhael","start":"07-02","attribute":"Estudo e concentração"},{"name":"Yeiayel","start":"07-07","attribute":"Reconhecimento e prosperidade"},{"name":"Melahel","start":"07-12","attribute":"Saúde e natureza"},{"name":"Hahuiah","start":"07-17","attribute":"Protecção e prudência"},{"name":"Nithaiah","start":"07-23","attribute":"Sabedoria e contemplação"},{"name":"Haaiah","start":"07-28","attribute":"Diplomacia e estratégia"},{"name":"Yerathel","start":"08-02","attribute":"Liberdade e expressão"},{"name":"Seheiah","start":"08-07","attribute":"Resistência e re me":"Nemamiah","start":"01-01","attribute":"Estratégia e coragem"},{"name":"Yeialel","start":"01-06","attribute":"Resiliência e clareza"},{"name":"Harahel","start":"01-11","attribute":"Conhecimento e estudo"},{"name":"Mitzrael","start":"01-16","attribute":"Organização e reparação"},{"name":"Umabel","start":"01-21","attribute":"Afinidade e amizade"},{"name":"Iah-Hel","start":"01-26","attribute":"Paz e recolhimento"},{"name":"Anauel","start":"01-31","attribute":"Comércio e comunicação"},{"name":"Mehiel","start":"02-05","attribute":"Criatividade e inspiração"},{"name":"Damabiah","start":"02-10","attribute":"Água e intuição"},{"name":"Manakel","start":"02-15","attribute":"Sono e tranquilidade"},{"name":"Eyael","start":"02-20","attribute":"Compreensão e maturidade"},{"name":"Habuhiah","start":"02-25","attribute":"Cuidado e fertilidade"},{"name":"Rochel","start":"03-01","attribute":"Restituição e justiça"},{"name":"Jabamiah","start":"03-06","attribute":"Transformação e renovação"},{"name":"Haiaiel","start":"03-11","attribute":"Protecção e firmeza"},{"name":"Mumiah","start":"03-16","attribute":"Conclusão e sabedoria"}];
function angelForDate(date){const md=String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');let chosen=ANGELS[55];for(const a of ANGELS){if(a.start<=md)chosen=a;}return {angel:chosen,index:ANGELS.indexOf(chosen)};}
function angelTime(i){const start=i*20,end=start+20;const fmt=n=>String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0');return fmt(start)+'–'+fmt(end);}
const todayAngel=angelForDate(new Date());
const ANGEL_UI={
'pt-PT':{attrs:'Atributos',hour:'Hora simbólica',note:'Intervalo tradicional de 20 minutos, apresentado em hora de relógio. Não é uma garantia de eficácia espiritual.'},
'pt-BR':{attrs:'Atributos',hour:'Horário simbólico',note:'Intervalo tradicional de 20 minutos, apresentado em hora de relógio. Não é garantia de eficácia espiritual.'},
en:{attrs:'Attributes',hour:'Symbolic time',note:'Traditional 20-minute clock interval. No spiritual outcome is guaranteed.'},
es:{attrs:'Atributos',hour:'Horario simbólico',note:'Intervalo tradicional de 20 minutos en hora de reloj. No garantiza resultados espirituales.'}};

const day=[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-');let seed=0;const key='maison-card-seed';try{seed=Number(localStorage.getItem(key));if(!seed){seed=Math.floor(Math.random()*1000000)+1;localStorage.setItem(key,String(seed));}}catch{seed=137;}
let hash=2166136261;for(const c of day+seed){hash^=c.charCodeAt(0);hash=Math.imul(hash,16777619);}const index=(hash>>>0)%78,phraseIndex=((hash>>>8)>>>0)%8;
let lang=navigator.language in I?navigator.language:'pt-PT';const sel=document.getElementById('lang');sel.value=lang;
function render(){lang=sel.value;document.documentElement.lang=lang;const d=I[lang];for(const k of ['heading','intro','label','angelHeading','angelNotice','share','save','disclaimer','home'])document.getElementById(k).textContent=d[k];document.getElementById('card').textContent=cardName(index,lang);document.getElementById('quote').textContent='«'+d.phrases[phraseIndex]+'»';const au=ANGEL_UI[lang];document.getElementById('angelNotice').textContent=todayAngel.angel.name+' · '+au.attrs+': '+todayAngel.angel.attribute+' · '+au.hour+': '+angelTime(todayAngel.index)+'. '+au.note;}sel.addEventListener('change',render);render();
function canvas(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#100e0b';x.fillRect(0,0,1080,1350);x.strokeStyle='#a88b59';x.lineWidth=3;x.strokeRect(75,75,930,1200);x.textAlign='center';x.fillStyle='#d6ba86';x.font='35px Georgia';x.fillText('MAISON JF®',540,170);x.font='30px Georgia';x.fillText(I[lang].label.toUpperCase(),540,290);x.fillStyle='#f1ece3';x.font='58px Georgia';x.fillText(cardName(index,lang),540,520,880);x.font='42px Georgia';const words=I[lang].phrases[phraseIndex].split(' ');let lines=[],line='';for(const w of words){if(x.measureText(line+' '+w).width>820){lines.push(line);line=w;}else line+=(line?' ':'')+w;}lines.push(line);lines.forEach((s,i)=>x.fillText(s,540,700+i*64));x.fillStyle='#d6ba86';x.font='32px Georgia';x.fillText('maison-jf.com/carta-do-dia',540,1180);return c;}
document.getElementById('save').onclick=()=>canvas().toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='maison-jf-carta-do-dia.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
document.getElementById('share').onclick=()=>canvas().toBlob(async b=>{const file=new File([b],'maison-jf-carta-do-dia.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:I[lang].heading});else if(navigator.share)await navigator.share({title:I[lang].heading,url:location.href});else document.getElementById('save').click();}catch(e){if(e.name!=='AbortError')document.getElementById('save').click();}});
