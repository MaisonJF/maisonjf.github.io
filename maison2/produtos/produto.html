<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto — MAISON JF®</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../maison.css"><style>.product-page{padding:130px 0 110px}.product-hero{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.product-hero h1{font:400 clamp(52px,7vw,96px)/.9 var(--serif);margin:.25em 0}.product-hero__copy>p{max-width:540px;color:#bdb7ad}.product-price{font:400 26px var(--serif);margin:25px 0}.product-actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.product-next{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);color:#918b82;font-size:14px}.product-next a{color:#d8cdb8}.gallery{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:100px}.gallery .media-slot:nth-child(4n+1){grid-column:span 7}.gallery .media-slot:nth-child(4n+2){grid-column:span 5}.gallery .media-slot:nth-child(4n+3){grid-column:span 5}.gallery .media-slot:nth-child(4n){grid-column:span 7}.gallery .media-slot{aspect-ratio:4/5}.gallery .media-slot:nth-child(4n),.gallery .media-slot:nth-child(4n+1){aspect-ratio:16/10}.ritual{margin-top:90px;padding:70px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:65px}.ritual h2{font:400 clamp(38px,5vw,60px)/1 var(--serif);margin:.2em 0}.ritual p{color:#aaa39a}.related{margin-top:75px}.related h2{font:400 38px/1 var(--serif)}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.related-card{padding:24px;border:1px solid var(--line);display:flex;flex-direction:column;min-height:190px}.related-card small{color:#8f887e;text-transform:uppercase;letter-spacing:.14em}.related-card strong{font:400 25px/1.05 var(--serif);margin:12px 0}.related-card span{margin-top:auto;color:#d4c6aa}.not-found{max-width:650px;padding-top:80px}.not-found h1{font:400 clamp(48px,7vw,82px)/.95 var(--serif)}@media(max-width:760px){.product-hero,.ritual{grid-template-columns:1fr;gap:35px}.gallery{display:block}.gallery .media-slot{margin-bottom:14px;aspect-ratio:4/5!important}.related-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="../">MAISON JF®</a><nav><a href="./">Produtos</a><a href="../teste/">Teste</a><a href="../servicos/">Serviços</a></nav></header><main class="product-page shell" id="page"></main><script src="../data/products.js"></script><script>(function(){const params=new URLSearchParams(location.search),slug=params.get('slug')||params.get('produto'),all=window.MAISON_PRODUCTS||[],p=all.find(x=>x.slug===slug),money=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n),page=document.querySelector('#page');if(!p){document.title='Produto não encontrado — MAISON JF®';page.innerHTML='<section class="not-found"><p class="eyebrow">MAISON JF®</p><h1>Esse produto não está nesta prateleira.</h1><p>Não te vou mostrar outro produto como se fosse o que escolheste.</p><a class="button button--light" href="./">Ver o catálogo actual</a></section>';return;}document.title=`${p.name} — MAISON JF®`;const hero=p.media.find(m=>m.role==='hero')||p.media[0],rest=p.media.filter(m=>m!==hero),contact=`../contacto/?produto=${encodeURIComponent(p.slug)}&preco=${encodeURIComponent(p.priceNote||money(p.price))}`;const ritual={'escalda-pes':['Não compliques a pausa.','Prepara água morna, deixa os pés parar primeiro e dá ao resto de ti alguns minutos para chegar depois. Não precisa de ser uma cerimónia perfeita para ser tua.'],'vela-vidro':['Acende para mudar de ritmo.','Usa a luz e o aroma como marcador: o trabalho acabou, a casa começou, ou simplesmente este momento é diferente do anterior.'],'vela-pequena':['Um gesto pequeno também conta.','Escolhe um canto, acende e deixa que aquele ponto de luz marque alguns minutos que não precisam de servir para mais nada.'],'vela-massagem':['Calor, toque, tempo.','Integra a vela num momento de massagem sem pressa. O valor está tanto no produto como no tempo que decidiste reservar ao toque.'],'oleo-massagem':['O corpo percebe o toque antes da explicação.','Usa o óleo num momento de massagem a solo ou acompanhado e deixa o ritual ter princípio e fim, em vez de ser mais uma coisa feita à pressa.'],'nevoa-bruma':['Muda o ar antes de mudares tudo.','Alguns gestos no espaço bastam para assinalar outra atmosfera. Usa a bruma quando queres uma mudança imediata de aroma.'],'wax-melts':['Deixa o aroma ocupar o espaço.','Usa os Wax Melts no teu queimador adequado para criar ambiente e escolher conscientemente como queres que aquele momento se sinta.'],'mikado':['Um aroma que fica.','Coloca o Mikado num ponto onde o ar circule e deixa o perfume fazer parte da casa sem precisares de o reiniciar a cada utilização.']}[p.slug]||['Leva o ritual para casa.','Usa este produto como um gesto deliberado de pausa e presença.'];const complementary={Corpo:['vela-vidro','nevoa-bruma','mikado'],Casa:['escalda-pes','oleo-massagem','vela-massagem']}[p.category]||[];const related=complementary.map(s=>all.find(x=>x.slug===s)).filter(Boolean).slice(0,3);page.innerHTML=`<section class="product-hero"><div class="media-slot media-slot--portrait">${hero?`<img src="${hero.src}" alt="${hero.alt}">`:'<div aria-hidden="true"></div>'}</div><div class="product-hero__copy"><p class="eyebrow">${p.category} · MAISON JF®</p><h1>${p.name}${p.size?` <span style="font-size:.35em">${p.size}</span>`:''}</h1><p>${p.description}</p><div class="product-price">${p.priceNote||money(p.price)}</div><div class="product-actions"><a class="button button--light" data-buy href="${contact}">${p.cta}</a><a class="text-link" href="../teste/">Não sei se é isto →</a></div><div class="product-next">Podes começar por este produto e ficar por aqui. Ou, se o momento te mostrar que há mais qualquer coisa a pedir atenção, <a href="../servicos/#acompanhamento">continua em Acompanhamento →</a></div></div></section>${rest.length?`<section class="gallery">${rest.map(m=>`<div class="media-slot"><img src="${m.src}" alt="${m.alt}" loading="lazy"></div>`).join('')}</section>`:''}<section class="ritual"><div><p class="eyebrow">Leva-o contigo</p><h2>${ritual[0]}</h2><p>${ritual[1]}</p></div><div><p class="eyebrow">Se isto for só a entrada</p><h2>O próximo passo não tem de ser outro produto.</h2><p>Uma pausa pode chegar. Também pode abrir uma pergunta. Se quiseres olhar para o que está por trás com continuidade, vê os Acompanhamentos; se ainda não sabes o que precisas, faz o teste.</p><a class="text-link" href="../servicos/#acompanhamento">Ver Acompanhamentos →</a><br><a class="text-link" href="../teste/">Fazer O QUE ESTÁS A IGNORAR? →</a></div></section>${related.length?`<section class="related"><p class="eyebrow">Pode fazer sentido contigo</p><h2>Continua o ritual.</h2><div class="related-grid">${related.map(r=>`<a class="related-card" data-related="${r.slug}" href="./produto.html?slug=${encodeURIComponent(r.slug)}"><small>${r.category}</small><strong>${r.name}</strong><span>${r.priceNote||money(r.price)} · Ver →</span></a>`).join('')}</div></section>`:''}`;if(window.maisonAnalytics?.track)window.maisonAnalytics.track('maison_product_view',{product:p.slug,price:p.price});page.addEventListener('click',e=>{const buy=e.target.closest('[data-buy]'),rel=e.target.closest('[data-related]');if(buy&&window.maisonAnalytics?.track)window.maisonAnalytics.track('product_contact_click',{product:p.slug,price:p.price,page_path:location.pathname});if(rel&&window.maisonAnalytics?.track)window.maisonAnalytics.track('product_cross_sell',{from:p.slug,to:rel.dataset.related,page_path:location.pathname});});})();</script></body></html>
