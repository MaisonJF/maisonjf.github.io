<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto — MAISON JF®</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../maison.css"><style>.product-page{padding:130px 0 110px}.product-hero{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.product-hero h1{font:400 clamp(52px,7vw,96px)/.9 var(--serif);margin:.25em 0}.product-hero__copy>p{max-width:540px;color:#bdb7ad}.product-price{font:400 24px var(--serif);margin:25px 0}.product-next{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);color:#918b82;font-size:14px}.product-next a{color:#d8cdb8}.gallery{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:100px}.gallery .media-slot:nth-child(4n+1){grid-column:span 7}.gallery .media-slot:nth-child(4n+2){grid-column:span 5}.gallery .media-slot:nth-child(4n+3){grid-column:span 5}.gallery .media-slot:nth-child(4n){grid-column:span 7}.gallery .media-slot{aspect-ratio:4/5}.gallery .media-slot:nth-child(4n),.gallery .media-slot:nth-child(4n+1){aspect-ratio:16/10}.empty-state{margin-top:90px;padding:70px 0;border-top:1px solid var(--line);color:#777}.empty-state strong{display:block;color:#aaa;font:400 28px var(--serif)}.not-found{max-width:650px;padding-top:80px}.not-found h1{font:400 clamp(48px,7vw,82px)/.95 var(--serif)}@media(max-width:760px){.product-hero{grid-template-columns:1fr;gap:35px}.gallery{display:block}.gallery .media-slot{margin-bottom:14px;aspect-ratio:4/5!important}}</style></head><body><header class="site-header"><a class="brand" href="../">MAISON JF®</a><nav><a href="./">Produtos</a><a href="../teste/">Teste</a><a href="../#portas">Portas</a></nav></header><main class="product-page shell" id="page"></main><script src="../data/products.js"></script><script>
const params=new URLSearchParams(location.search),slug=params.get('slug')||params.get('produto');
const p=window.MAISON_PRODUCTS.find(x=>x.slug===slug);
const money=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n);
const page=document.querySelector('#page');
if(!p){document.title='Produto não encontrado — MAISON JF®';page.innerHTML='<section class="not-found"><p class="eyebrow">MAISON JF®</p><h1>Esse produto não está nesta prateleira.</h1><p>Não te vou mostrar outro produto como se fosse o que escolheste.</p><a class="button button--light" href="./">Ver o catálogo actual</a></section>';}else{
 document.title=`${p.name} — MAISON JF®`;
 const hero=p.media.find(m=>m.role==='hero')||p.media[0],rest=p.media.filter(m=>m!==hero);
 const contact=`../../contactos.html?produto=${encodeURIComponent(p.slug)}`;
 page.innerHTML=`<section class="product-hero"><div class="media-slot media-slot--portrait">${hero?`<img src="${hero.src}" alt="${hero.alt}">`:'<div class="slot-note"></div>'}</div><div class="product-hero__copy"><p class="eyebrow">${p.category} · MAISON JF®</p><h1>${p.name}${p.size?` <span style="font-size:.35em">${p.size}</span>`:''}</h1><p>${p.description}</p><div class="product-price">${p.priceNote||money(p.price)}</div><a class="button button--light" href="${contact}">${p.cta}</a><div class="product-next">Um produto pode ser o primeiro gesto. Se percebes que o que está por trás pede mais do que um ritual, <a href="../servicos/">continua para Acompanhamentos e Serviços →</a></div></div></section>${rest.length?`<section class="gallery">${rest.map(m=>`<div class="media-slot"><img src="${m.src}" alt="${m.alt}" loading="lazy"></div>`).join('')}</section>`:`<section class="empty-state"><strong>A história visual deste produto pode crescer aqui.</strong>Detalhe · textura · uso · ritual · ambiente. Quando existirem novas imagens, aparecem automaticamente sem criar espaços vazios.</section>`}`;
 if(window.maisonAnalytics?.track)window.maisonAnalytics.track('maison_product_view',{product:p.slug,price:p.price});
}
</script></body></html>
