<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos — MAISON JF®</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../maison.css"><style>.catalogue{padding:140px 0 100px}.catalogue h1{font:400 clamp(52px,8vw,110px)/.9 var(--serif);margin:.2em 0}.catalogue__intro{max-width:650px;color:#bdb7ad}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:60px}.product{background:#111}.product__media{aspect-ratio:4/5;background:linear-gradient(145deg,#151515,#20201e);overflow:hidden}.product__media img{width:100%;height:100%;object-fit:cover}.product__body{padding:22px}.product__body small{letter-spacing:.18em;text-transform:uppercase;color:#999}.product h2{font:400 30px/1 var(--serif);margin:.5em 0}.price{font-size:14px}.product p{color:#aaa39a}.slot-note{display:grid;place-items:center;height:100%;color:#67645f;font-size:10px;letter-spacing:.16em;text-transform:uppercase}@media(max-width:800px){.product-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.product-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="../">MAISON JF®</a><nav><a href="../#portas">Portas</a><a href="./">Produtos</a></nav></header><main class="catalogue shell"><p class="eyebrow">Casa · Corpo</p><h1>Objectos para<br>voltar a sentir.</h1><p class="catalogue__intro">Cada produto começa simples. À medida que a sua história visual cresce, entram novas fotografias — detalhe, textura, uso, ritual e ambiente — sem mudar a estrutura da página.</p><div class="product-grid" id="products"></div></main><script src="../data/products.js"></script><script>const money=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n);const root=document.querySelector('#products');window.MAISON_PRODUCTS.forEach(p=>{const hero=p.media.find(m=>m.role==='hero')||p.media[0];const el=document.createElement('article');el.className='product';el.innerHTML=`<div class="product__media">${hero?`<img src="${hero.src}" alt="${hero.alt}" loading="lazy">`:'<div class="slot-note">Slot de imagem disponível</div>'}</div><div class="product__body"><small>${p.category}</small><h2>${p.name}${p.size?` <span style="font-size:.45em">${p.size}</span>`:''}</h2><div class="price">${p.priceNote||money(p.price)}</div><p>${p.description}</p><a class="text-link" href="./produto.html?produto=${encodeURIComponent(p.slug)}">Descobrir →</a></div>`;root.append(el)});</script></body></html>
