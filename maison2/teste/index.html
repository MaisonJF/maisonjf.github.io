<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O QUE ESTÁS A IGNORAR? — MAISON JF®</title><meta name="description" content="Um teste breve para perceber que parte da tua vida está a pedir atenção e encontrar um primeiro passo MAISON JF®."><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../maison.css"><style>.test{min-height:100svh;padding:120px 20px 70px;background:radial-gradient(circle at 50% 12%,#28221c,#0b0a09 36%,#050505 72%)}.box{width:min(760px,100%);margin:auto}.step{display:none}.step.on{display:block}.progress{font:10px Arial;letter-spacing:.18em;text-transform:uppercase;color:#8f887d;margin-bottom:26px}.title{font:400 clamp(48px,8vw,88px)/.95 var(--serif);margin:.2em 0}.q{font:400 clamp(27px,4vw,40px)/1.2 var(--serif);margin:25px 0}.choices{display:grid;gap:10px}.choices button{padding:17px 18px;text-align:left;border:1px solid var(--line);background:#0e0e0e;color:#eee9df;font:17px/1.4 var(--serif);cursor:pointer}.choices button:hover{background:#171512}.result{border-top:1px solid var(--line);padding-top:30px}.offer{margin:34px 0;padding:28px;border:1px solid rgba(183,154,98,.38);background:rgba(183,154,98,.06)}.offer h2{font:400 32px/1.05 var(--serif);margin:.2em 0}.next{color:#bdb6aa}.restart{border:0;background:none;color:#999;text-decoration:underline;cursor:pointer;margin-top:25px}</style></head><body><header class="site-header"><a class="brand" href="../">MAISON JF®</a><nav><a href="../respostas/">Respostas</a><a href="../produtos/">Produtos</a></nav></header><main class="test"><div class="box"><section id="intro" class="step on"><p class="eyebrow">≈ 2 minutos · sem resposta certa</p><h1 class="title">O QUE ESTÁS<br>A IGNORAR?</h1><p>Não é um diagnóstico. É uma forma rápida de perceber onde estás a gastar mais de ti — e qual pode ser o primeiro gesto útil agora.</p><button class="button button--light" onclick="show(1)">Começar</button></section><section id="questions" class="step"><div class="progress" id="progress"></div><div class="q" id="question"></div><div class="choices" id="choices"></div></section><section id="result" class="step"><p class="eyebrow">O teu ponto de entrada</p><h1 class="title" id="resultTitle"></h1><p id="resultText"></p><div class="offer"><p class="eyebrow">Começa aqui</p><h2 id="offerTitle"></h2><p id="offerText"></p><a class="button button--light" id="offerCta"></a></div><p class="next" id="nextText"></p><a class="text-link" id="nextCta"></a><br><button class="restart" onclick="restart()">Refazer o teste</button></section></div></main><script>
const qs=[
 ['Quando tens finalmente um momento livre, o que acontece primeiro?',[['corpo','Percebo o cansaço que andei a empurrar.'],['cabeca','A cabeça começa logo a rever problemas e decisões.'],['casa','Olho à volta e sinto que nem o espaço me ajuda a desligar.'],['companhia','Sinto sobretudo falta de ter alguém comigo.']]],
 ['Qual destas frases te apanha mais depressa?',[['cabeca','“Eu sei que estou às voltas, mas não consigo parar de pensar nisto.”'],['corpo','“Até descansar me parece mais uma coisa para fazer.”'],['companhia','“Eu fazia isto se não tivesse de ir sozinho.”'],['casa','“Queria entrar em casa e sentir outra coisa.”']]],
 ['Quando uma relação ou situação te mexe muito, o que fazes?',[['cabeca','Procuro sinais, respostas e explicações.'],['corpo','Fico tenso, cansado ou sem conseguir realmente parar.'],['companhia','Procuro alguém com quem estar ou falar.'],['casa','Fecho-me no meu espaço e tento criar algum conforto.']]],
 ['O que te faria sentir uma diferença ainda hoje?',[['corpo','Um banho, calor, toque ou um ritual físico.'],['casa','Mudar o aroma ou a atmosfera à minha volta.'],['cabeca','Conseguir finalmente organizar uma pergunta.'],['companhia','Ter um plano com outra pessoa em vez de ficar sozinho.']]],
 ['O que tens adiado mais?',[['cabeca','Uma decisão ou conversa que continua pendente.'],['corpo','Cuidar de mim sem ser à pressa.'],['casa','Tornar a casa mais minha e mais agradável.'],['companhia','Sair, viver alguma coisa ou pedir presença.']]],
 ['Se a Maison te pudesse dar uma coisa agora, qual escolherias?',[['cabeca','Clareza.'],['corpo','Pausa.'],['casa','Atmosfera.'],['companhia','Presença.']]],
 ['E se esse primeiro gesto não chegasse, o que aceitarias fazer depois?',[['servico','Falar do meu caso e aprofundar.'],['produto','Experimentar outro ritual ou produto.'],['conteudo','Ler e perceber melhor primeiro.'],['companhia','Ter alguém comigo num momento concreto.']]]
];
let i=0,scores={casa:0,corpo:0,cabeca:0,companhia:0},depth='';
const $=id=>document.getElementById(id);function section(id){document.querySelectorAll('.step').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function show(n){i=n-1;section('questions');render()}function render(){const q=qs[i];$('progress').textContent=`${i+1} / ${qs.length}`;$('question').textContent=q[0];$('choices').innerHTML='';q[1].forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>answer(key);$('choices').appendChild(b)})}function answer(key){if(i===qs.length-1)depth=key;else scores[key]=(scores[key]||0)+1;i++;if(i<qs.length)render();else finish()}
const routes={
 corpo:{title:'CORPO',text:'Há uma parte tua a pedir uma coisa muito menos abstracta do que “organiza a vida”: parar no corpo.',offer:'Escalda-Pés · 150 g · 5 €',offerText:'Uma entrada pequena na Maison: água morna, aroma e um momento que não precisa de produzir nada.',href:'../produtos/produto.html?slug=escalda-pes',cta:'Quero começar por aqui · 5 €'},
 casa:{title:'CASA',text:'O espaço à tua volta está a pesar mais do que parece. Talvez não precises de mudar a casa toda; precisas de mudar a forma como ela te recebe.',offer:'Névoa / Bruma · 6,50 €',offerText:'A forma mais imediata do catálogo actual para mudar o aroma e marcar outro ambiente.',href:'../produtos/produto.html?slug=nevoa-bruma',cta:'Quero mudar o ambiente · 6,50 €'},
 cabeca:{title:'CABEÇA',text:'Estás a gastar energia a tentar chegar sozinho a uma resposta que continua a fugir ou a mudar de forma.',offer:'Consulta de Tarot · 35 €',offerText:'Traz a pergunta concreta. A consulta serve para organizar perspectivas e possibilidades sem decidir por ti nem prometer o futuro.',href:'../servicos/',cta:'Quero olhar para o meu caso · 35 €'},
 companhia:{title:'COMPANHIA',text:'O que te falta não parece ser mais uma coisa para fazer. Parece ser presença enquanto fazes ou atravessas alguma coisa.',offer:'Companhia combinada',offerText:'Café, passeio, evento ou outro momento acordado, dentro dos limites definidos pelo serviço.',href:'../servicos/',cta:'Quero ver Companhia'}
};
function finish(){const order=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const key=order[0][0],r=routes[key];$('resultTitle').textContent=r.title;$('resultText').textContent=r.text;$('offerTitle').textContent=r.offer;$('offerText').textContent=r.offerText;$('offerCta').href=r.href;$('offerCta').textContent=r.cta;const deeper=depth==='servico'||(key==='cabeca'&&depth!=='produto');$('nextText').textContent=deeper?'Se sentes que isto não termina no primeiro gesto, não precisas de ficar só na superfície.':'O primeiro passo não tem de ser o último. Se fizer sentido, a Maison continua contigo a partir daqui.';$('nextCta').href=deeper?'../servicos/':key==='companhia'?'../servicos/':'../respostas/';$('nextCta').textContent=deeper?'Ver Acompanhamentos e Serviços →':'Continuar a explorar →';section('result');if(window.maisonAnalytics?.track)window.maisonAnalytics.track('maison_test_result',{door:key,depth});}
function restart(){i=0;scores={casa:0,corpo:0,cabeca:0,companhia:0};depth='';section('intro')}
</script></body></html>
