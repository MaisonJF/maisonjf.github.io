<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviços — MAISON JF®</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../maison.css"><style>.services{padding:150px 0 120px}.services h1{font:400 clamp(54px,8vw,110px)/.9 var(--serif);margin:.2em 0}.services>p{max-width:680px;color:#bdb7ad}.service-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:65px}.service{background:#111;min-height:340px;display:flex;flex-direction:column}.service__media{aspect-ratio:16/10;overflow:hidden}.service__media img{width:100%;height:100%;object-fit:cover;display:block}.service__body{padding:38px;display:flex;flex:1;flex-direction:column;justify-content:flex-end}.service small{letter-spacing:.18em;text-transform:uppercase;color:#999}.service h2{font:400 38px/1 var(--serif);margin:.4em 0}.service p{color:#aaa39a}.service .price{color:#fff}.service__limits{font-size:.88rem}.service__body a{margin-top:12px}@media(max-width:650px){.service-grid{grid-template-columns:1fr}.service__body{padding:28px}}</style></head><body><header class="site-header"><a class="brand" href="../">MAISON JF®</a><nav><a href="../portas/cabeca.html">Cabeça</a><a href="../portas/companhia.html">Companhia</a></nav></header><main class="services shell"><p class="eyebrow">Serviços</p><h1>Às vezes precisas<br>de mais do que ler.</h1><p>Quando a resposta depende da tua história, a Maison pode abrir espaço para olhar para o caso concreto — com limites claros sobre aquilo que cada serviço pode e não pode fazer.</p><section class="service-grid" id="serviceGrid" aria-live="polite"></section></main><script src="../data/services.js"></script><script>(function(){const grid=document.getElementById('serviceGrid');const items=window.MAISON_SERVICES||[];const contact='../../contactos.html';items.forEach(s=>{const article=document.createElement('article');article.className='service';article.id=s.slug;const media=(s.media||[])[0];article.innerHTML=(media?`<div class="service__media media-slot"><img src="${media.src}" alt="${media.alt}" loading="lazy"></div>`:'')+`<div class="service__body"><small>${s.door}</small><h2>${s.name}</h2><p>${s.description}</p>${s.price?`<p class="price">${s.price}</p>`:''}<p class="service__limits">${s.limits}</p><a class="text-link" href="${contact}">${s.cta} →</a></div>`;grid.appendChild(article);});})();</script></body></html>
