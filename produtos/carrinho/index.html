<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Carrinho | MAISON JF®</title>
<meta name="description" content="Revê a tua encomenda MAISON JF®, escolhe a zona de envio e vê quando os portes ficam grátis.">
<link rel="stylesheet" href="../../maison.css?v=20260925-experience1">
<script src="../../analytics.js" defer></script>
<style>
.cart{padding:130px 0 100px}.cart h1{font:400 clamp(52px,8vw,92px)/.92 var(--serif);margin:.2em 0}.cart__lead{max-width:680px;color:#aaa39a}.cart__grid{display:grid;grid-template-columns:1.3fr .7fr;gap:28px;margin-top:42px}.cart__items{display:grid;gap:12px}.cart-item{border:1px solid var(--line);padding:22px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:#10100f}.cart-item h2{font:400 28px/1 var(--serif);margin:0 0 6px}.cart-item p{margin:0;color:#9c958b}.cart-item__controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.cart-item button{border:1px solid var(--line);background:transparent;color:#eee9df;padding:8px 11px;cursor:pointer}.cart-item__qty{min-width:24px;text-align:center}.cart-item__remove{font-size:11px;color:#9c958b!important}.cart__summary{border:1px solid var(--line);padding:28px;background:#10100f;align-self:start;position:sticky;top:90px}.cart__summary h2{font:400 32px/1 var(--serif);margin:0 0 22px}.cart__row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.cart__zones{display:grid;gap:8px;margin:22px 0}.cart__zone{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:13px;cursor:pointer}.cart__zone input{margin-top:3px}.cart__zone small{display:block;color:#91897f;margin-top:4px}.cart__zone:has(input:checked){border-color:rgba(210,179,111,.72);background:rgba(210,179,111,.06)}.cart__total{font:400 28px/1 var(--serif);padding-top:18px}.cart__status{min-height:1.4em;color:#aaa39a;font-size:12px;margin-top:12px}.cart__empty{border:1px solid var(--line);padding:36px;background:#10100f}.cart__empty h2{font:400 36px/1 var(--serif);margin:.1em 0 .4em}@media(max-width:800px){.cart{padding-top:112px}.cart__grid{grid-template-columns:1fr;gap:18px}.cart__summary{position:static;padding:22px}.cart-item{grid-template-columns:1fr;padding:18px}.cart-item__controls{justify-content:flex-start}.cart__zone{min-height:64px;padding:14px}.cart__summary .button{width:100%;min-height:52px;text-align:center}.cart__row{align-items:baseline}}</style>
</head>
<body>
<header class="site-header"><a class="brand" href="../../">MAISON JF®</a><nav><a href="../../farol">O Farol</a><a href="../">Produtos</a><a href="../../servicos/">Serviços</a></nav></header>
<main class="cart shell">
<p class="eyebrow">Encomenda</p><h1>O teu carrinho.</h1>
<p class="cart__lead">Escolhe os produtos. Escolhe a zona. O checkout faz as contas.</p>
<div class="cart__grid" id="cartGrid">
  <section class="cart__items" id="cartItems" aria-live="polite"></section>
  <aside class="cart__summary" id="cartSummary">
    <h2>Resumo</h2>
    <div class="cart__row"><span>Produtos</span><strong id="subtotal">0 €</strong></div>
    <div class="cart__zones" aria-label="Zona de envio">
      <label class="cart__zone"><input type="radio" name="shipping" value="mainland"><span><strong>Portugal Continental</strong><small>5,90 € · grátis a partir de 49 €</small></span></label>
      <label class="cart__zone"><input type="radio" name="shipping" value="islands"><span><strong>Açores e Madeira</strong><small>11,90 € · grátis a partir de 79 €</small></span></label>
      <label class="cart__zone"><input type="radio" name="shipping" value="eu"><span><strong>União Europeia</strong><small>17,90 € · grátis a partir de 99 €</small></span></label>
      <label class="cart__zone"><input type="radio" name="shipping" value="world"><span><strong>Resto do mundo</strong><small>29,90 € · grátis a partir de 149 €</small></span></label>
    </div>
    <div class="cart__row"><span>Envio</span><strong id="shipping">Escolhe a zona</strong></div>
    <div class="cart__row cart__total"><span>Total</span><strong id="total">0 €</strong></div>
    <button class="button button--light" id="checkout" type="button" disabled>Escolhe a zona</button>
    <p class="cart__status" id="status" aria-live="polite"></p>
    <p><a class="text-link" href="../../envios">Ver condições de envio</a></p>
  </aside>
</div>
</main>
<script src="../../data/products.js"></script>
<script>
(()=>{
 const KEY='maisonPhysicalCartV1';
 const products=Object.fromEntries((window.MAISON_PRODUCTS||[]).map(p=>[p.slug,p]));
 const rates={
  mainland:{amount:5.90,threshold:49},
  islands:{amount:11.90,threshold:79},
  eu:{amount:17.90,threshold:99},
  world:{amount:29.90,threshold:149}
 };
 const itemsHost=document.getElementById('cartItems'),summary=document.getElementById('cartSummary'),subtotalEl=document.getElementById('subtotal'),shippingEl=document.getElementById('shipping'),totalEl=document.getElementById('total'),checkout=document.getElementById('checkout'),status=document.getElementById('status');
 const money=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}).format(n);
 const read=()=>{try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(raw)?raw:[]}catch{return[]}};
 const write=items=>localStorage.setItem(KEY,JSON.stringify(items.filter(x=>x.quantity>0)));
 let cart=normalise(read());

 function normalise(list){
  const map=new Map();
  for(const raw of list){
   const slug=String(raw?.slug||''); if(!products[slug])continue;
   const q=Math.max(1,Math.min(10,Number(raw?.quantity)||1));
   map.set(slug,Math.min(10,(map.get(slug)||0)+q));
  }
  return [...map.entries()].map(([slug,quantity])=>({slug,quantity}));
 }
 function subtotal(){return cart.reduce((sum,item)=>sum+products[item.slug].price*item.quantity,0)}
 function zone(){return document.querySelector('input[name="shipping"]:checked')?.value||''}
 function shippingCost(){
  const z=zone(); if(!z)return null;
  const r=rates[z],sub=subtotal(); return sub>=r.threshold?0:r.amount;
 }
 function render(){
  itemsHost.innerHTML='';
  if(!cart.length){
   itemsHost.innerHTML='<div class="cart__empty"><h2>O carrinho está vazio.</h2><p>Escolhe os produtos que queres juntar na mesma encomenda.</p><a class="button button--light" href="../">Ver Produtos</a></div>';
   summary.hidden=true;
   write(cart);
   return;
  }
  summary.hidden=false;
  for(const item of cart){
   const p=products[item.slug],el=document.createElement('article');el.className='cart-item';
   el.innerHTML='<div><h2>'+p.name+(p.size?' <span style="font-size:.5em">'+p.size+'</span>':'')+'</h2><p>'+money(p.price)+' cada · '+money(p.price*item.quantity)+'</p></div><div class="cart-item__controls"><button type="button" data-dec="'+item.slug+'" aria-label="Diminuir quantidade">−</button><span class="cart-item__qty">'+item.quantity+'</span><button type="button" data-inc="'+item.slug+'" aria-label="Aumentar quantidade">+</button><button class="cart-item__remove" type="button" data-remove="'+item.slug+'">Remover</button></div>';
   itemsHost.append(el);
  }
  updateTotals();write(cart);
 }
 function updateTotals(){
  const sub=subtotal(),ship=shippingCost();
  subtotalEl.textContent=money(sub);
  shippingEl.textContent=ship===null?'Escolhe a zona':ship===0?'Grátis':money(ship);
  totalEl.textContent=money(sub+(ship||0));
  checkout.disabled=!cart.length||!zone();
  checkout.textContent=zone()?'Continuar para pagamento':'Escolhe a zona';
 }
 itemsHost.addEventListener('click',e=>{
  const inc=e.target.closest('[data-inc]'),dec=e.target.closest('[data-dec]'),rem=e.target.closest('[data-remove]');
  if(inc){const item=cart.find(x=>x.slug===inc.dataset.inc);if(item)item.quantity=Math.min(10,item.quantity+1)}
  if(dec){const item=cart.find(x=>x.slug===dec.dataset.dec);if(item)item.quantity=Math.max(1,item.quantity-1)}
  if(rem)cart=cart.filter(x=>x.slug!==rem.dataset.remove);
  render();
 });
 document.querySelectorAll('input[name="shipping"]').forEach(input=>input.addEventListener('change',updateTotals));
 checkout.addEventListener('click',async()=>{
  const z=zone();if(!z||!cart.length)return;
  checkout.disabled=true;checkout.textContent='A abrir pagamento…';status.textContent='';
  window.maisonAnalytics?.track?.('physical_cart_checkout_intent',{items:cart,subtotal:subtotal(),shipping_zone:z,page_path:location.pathname});
  try{
   const response=await fetch('/api/create-product-checkout-live',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:cart,shipping_zone:z,attribution:window.maisonAnalytics?.getAttribution?.()||{}})});
   const data=await response.json().catch(()=>({}));
   if(!response.ok||!data.url)throw new Error(data.error||'Não foi possível abrir o checkout.');
   location.href=data.url;
  }catch(error){
   checkout.disabled=false;checkout.textContent='Continuar para pagamento';status.textContent=error.message||'Não foi possível abrir o checkout.';
  }
 });
 if(new URLSearchParams(location.search).get('checkout_cancelado')==='1')status.textContent='Pagamento cancelado. O carrinho continua aqui.';
 render();
})();
</script>
</body>
</html>
