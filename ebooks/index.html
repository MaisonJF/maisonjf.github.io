<script>(function(){const published=(window.MAISON_EBOOKS||[]).filter(b=>b.status==='published');function card(book){const el=document.createElement('article');el.className='ebook-card';const link=document.createElement('a');link.href='./'+encodeURIComponent(book.slug)+'/';const cover=document.createElement('div');cover.className='cover';const coverMedia=(book.media||[]).find(m=>m.role==='cover')||(book.media||[])[0];const coverSrc=book.cover||(coverMedia&&coverMedia.src);if(coverSrc){const img=document.createElement('img');img.src=coverSrc;img.alt=(coverMedia&&coverMedia.alt)||('Capa de '+book.title);img.loading='lazy';cover.appendChild(img)}else{cover.classList.add('cover--placeholder');const mark=document.createElement('div');mark.className='cover__mark';const label=document.createElement('small');label.textContent='Éditions Maison JF';const name=document.createElement('span');name.textContent=book.title;mark.append(label,name);cover.appendChild(mark)}link.appendChild(cover);const title=document.createElement('h2');title.textContent=book.title;const meta=document.createElement('p');meta.className='meta';meta.textContent=book.collection||'';el.append(link,title,meta);const discover=document.createElement('a');discover.className='text-link buy';discover.href='./'+encodeURIComponent(book.slug)+'/';discover.textContent='Descobrir →';el.appendChild(discover);return el}published.forEach(b=>document.getElementById('publishedGrid').appendChild(card(b)))})();</script>

    <div class="poster-viewer__canvas"><img class="poster-viewer__image" src="../images/ebooks/posters/virgulas-do-destino.webp?v=20260922-lossless-final" width="1024" height="1536" alt="Poster Vírgulas do Destino"></div>

</dialog>
<script>
(function(){
  const viewer=document.getElementById('poster-viewer');
  if(typeof viewer.showModal!=='function')return;
  const picture=viewer.querySelector('img');
  const title=document.getElementById('poster-viewer-title');
  const zoom=document.getElementById('poster-zoom');
  const close=document.getElementById('poster-close');
  const stage=viewer.querySelector('.poster-viewer__stage');
  let opener=null,previousOverflow='';
  function setZoom(on){
    viewer.classList.toggle('is-zoomed',on);
    zoom.setAttribute('aria-pressed',String(on));
    zoom.textContent=on?'Ajustar ao ecrã':'Ampliar 100%';
    stage.scrollTo(0,0);
  }
  document.querySelectorAll('.poster-open').forEach(function(link){
    link.addEventListener('click',function(event){
      if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
      event.preventDefault();
      opener=link;
      const thumbnail=link.querySelector('img');
      picture.src=link.href;
      picture.alt=thumbnail.alt;
      title.textContent=thumbnail.alt.replace(/^Poster /,'');
      setZoom(false);
      previousOverflow=document.documentElement.style.overflow;
      viewer.showModal();
      document.documentElement.style.overflow='hidden';
      close.focus();
    });
  });
  zoom.addEventListener('click',function(){setZoom(!viewer.classList.contains('is-zoomed'));});
  picture.addEventListener('click',function(){setZoom(!viewer.classList.contains('is-zoomed'));});
  close.addEventListener('click',function(){viewer.close();});
  viewer.addEventListener('click',function(event){
    if(event.target===stage||event.target.classList.contains('poster-viewer__canvas'))viewer.close();
  });
  viewer.addEventListener('close',function(){
    document.documentElement.style.overflow=previousOverflow;
    if(opener)opener.focus({preventScroll:true});
    picture.removeAttribute('src');
    setZoom(false);
  });
})();
</script>
