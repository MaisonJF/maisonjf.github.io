<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ebooks | MAISON JF®</title><meta name="description" content="Ebooks, histórias e colecções digitais MAISON JF®."><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../maison.css"><script src="../analytics.js" defer></script><style>.ebooks{padding:145px 0 100px}.ebooks h1{font:400 clamp(58px,9vw,112px)/.9 var(--serif);margin:.18em 0 .35em}.lead{max-width:650px;color:#aaa39a}.section-title{margin-top:70px;padding-top:25px;border-top:1px solid var(--line);font:400 32px/1 var(--serif)}.ebook-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 18px;margin-top:30px}.ebook-card{display:block;color:inherit;text-decoration:none}.cover{aspect-ratio:2/3;background:#111;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;padding:18px;text-align:center}.cover img{width:100%;height:100%;object-fit:cover}.cover span{font:400 20px/1.08 var(--serif);color:#8e877c}.ebook-card h2{font:400 25px/1.05 var(--serif);margin:14px 0 5px}.meta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8e877c}.soon{opacity:.7}.soon .cover{border-style:dashed}@media(max-width:900px){.ebook-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.ebook-grid{grid-template-columns:repeat(2,1fr);gap:28px 12px}.ebooks{padding-top:115px}.ebook-card h2{font-size:21px}}</style></head><body><header class="site-header"><a class="brand" href="../">MAISON JF®</a><nav><a href="../produtos/">Produtos</a><a href="../servicos/">Serviços</a><a href="../respostas/">Respostas</a></nav></header><main class="ebooks shell"><p class="eyebrow">Biblioteca digital</p><h1>Ebooks.</h1><p class="lead">Histórias, conhecimento e colecções da Maison. Uma biblioteca feita para crescer, sem perder espaço, ordem ou identidade.</p><section><h2 class="section-title">Já publicados</h2><div class="ebook-grid" id="publishedGrid"></div></section><section id="soonSection"><h2 class="section-title">Brevemente</h2><div class="ebook-grid" id="soonGrid"></div></section></main><script src="../data/ebooks.js"></script><script>(function(){const all=window.MAISON_EBOOKS||[],published=all.filter(b=>b.status==='published'),soon=all.filter(b=>b.status==='coming-soon');function card(book,isSoon){const el=document.createElement(isSoon?'article':'a');el.className='ebook-card'+(isSoon?' soon':'');if(!isSoon)el.href='./'+encodeURIComponent(book.slug)+'/';const cover=document.createElement('div');cover.className='cover';if(book.cover){const img=document.createElement('img');img.src=book.cover;img.alt='Capa de '+book.title;img.loading='lazy';cover.appendChild(img)}else{const mark=document.createElement('span');mark.textContent=isSoon?'Brevemente':'Vírgulas do Destino';cover.appendChild(mark)}const title=document.createElement('h2');title.textContent=book.title;const meta=document.createElement('p');meta.className='meta';meta.textContent=isSoon?'Brevemente':[book.collection,book.price!=null?Number(book.price).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €':null].filter(Boolean).join(' · ');el.append(cover,title,meta);return el}published.forEach(b=>document.getElementById('publishedGrid').appendChild(card(b,false)));soon.forEach(b=>document.getElementById('soonGrid').appendChild(card(b,true)));if(!soon.length)document.getElementById('soonSection').hidden=true})();</script></body></html>
