<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universos | MAISON JF®</title>
<meta name="description" content="Universos MAISON JF®: obras publicadas e sagas inéditas das Éditions Maison JF.">

<link rel="stylesheet" href="../maison.css?v=20260921-feral1"><script src="../analytics.js" defer></script>
<style>
.ebooks{padding:145px 0 110px}.ebooks h1{font:400 clamp(58px,9vw,112px)/.9 var(--serif);margin:.18em 0 .35em}.lead{max-width:660px;color:#aaa39a;font-size:1.02rem}
.section-title{margin-top:68px;padding-top:26px;border-top:1px solid var(--line);font:400 32px/1 var(--serif)}
.ebook-grid{display:grid;grid-template-columns:repeat(2,minmax(0,260px));gap:38px 22px;margin-top:32px}.ebook-card{display:block;color:inherit;text-decoration:none}.cover{aspect-ratio:2/3;background:#111;border:1px solid var(--line);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.ebook-card h2{font:400 25px/1.05 var(--serif);margin:14px 0 5px}.meta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8e877c}.buy{margin-top:10px}.status{min-height:1.5em;margin-top:30px;color:#aaa39a}
.poster-library{margin-top:100px;padding-top:70px;border-top:1px solid var(--line)}.poster-library__head{max-width:760px}.poster-library__lead{max-width:560px;margin:14px 0 0;color:#aaa39a;font-size:1rem}.poster-library__head h2{font:400 clamp(42px,5vw,62px)/.94 var(--serif);margin:.18em 0}.poster-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-top:38px;max-width:920px}.poster-card{margin:0;min-width:0}.poster-card img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;background:#0a0a0a;border:1px solid var(--line);image-rendering:auto}.poster-card figcaption{display:none}
@media(max-width:900px){.poster-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:720px}}@media(max-width:760px){.ebooks{padding-top:115px}.ebook-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}.ebook-card h2{font-size:21px}.poster-library{margin-top:76px;padding-top:58px}.poster-grid{gap:18px}}
@media(max-width:440px){.ebook-grid{grid-template-columns:1fr}.ebook-card{max-width:320px}.poster-grid{grid-template-columns:1fr;max-width:330px}.poster-library__head h2{font-size:44px}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="../">MAISON JF®</a><nav><a href="../farol">O Farol</a><a href="../teste/">Volta Para Casa</a><a href="../produtos/">Produtos</a><a href="../servicos/">Serviços</a></nav></header>
<main class="ebooks shell">
<p class="eyebrow">Éditions Maison JF</p><h1>Universos.</h1>
<p class="lead">Histórias que continuam depois da última página.</p>
<section aria-labelledby="published-title"><h2 class="section-title" id="published-title">Já publicados</h2><div class="ebook-grid" id="publishedGrid"></div><p class="status" id="edition-checkout-status" aria-live="polite"></p></section>
<section class="poster-library" aria-labelledby="posters-title">
  <div class="poster-library__head"><p class="eyebrow">Inéditos</p><h2 id="posters-title">Universos por revelar.</h2><p class="poster-library__lead">Já escritos. Ainda não publicados.</p></div>
  <div class="poster-grid">
    <figure class="poster-card"><img src="../images/ebooks/posters/virgulas-do-destino.webp?v=20260920-final2" width="180" height="270" alt="Poster Vírgulas do Destino" loading="lazy" decoding="async"><figcaption>Vírgulas do Destino</figcaption></figure>
    <figure class="poster-card"><img src="../images/ebooks/posters/sombras-da-luz.webp?v=20260920-final2" width="180" height="270" alt="Poster Sombras da Luz" loading="lazy" decoding="async"><figcaption>Sombras da Luz</figcaption></figure>
    <figure class="poster-card"><img src="../images/ebooks/posters/escrito-nas-entrelinhas.webp?v=20260920-final2" width="180" height="270" alt="Poster Escrito nas Entrelinhas" loading="lazy" decoding="async"><figcaption>Escrito nas Entrelinhas</figcaption></figure>
    <figure class="poster-card"><img src="../images/ebooks/posters/sombras-da-alma.webp?v=20260920-final2" width="180" height="270" alt="Poster Sombras da Alma" loading="lazy" decoding="async"><figcaption>Sombras da Alma</figcaption></figure>
  </div>
</section>
</main>
<script src="../data/ebooks.js"></script>
<script>(function(){const published=(window.MAISON_EBOOKS||[]).filter(b=>b.status==='published');function card(book){const el=document.createElement('article');el.className='ebook-card';const link=document.createElement('a');link.href='./'+encodeURIComponent(book.slug)+'/';const cover=document.createElement('div');cover.className='cover';const coverMedia=(book.media||[]).find(m=>m.role==='cover')||(book.media||[])[0];const coverSrc=book.cover||(coverMedia&&coverMedia.src);if(coverSrc){const img=document.createElement('img');img.src=coverSrc;img.alt=(coverMedia&&coverMedia.alt)||('Capa de '+book.title);img.loading='lazy';cover.appendChild(img)}link.appendChild(cover);const title=document.createElement('h2');title.textContent=book.title;const meta=document.createElement('p');meta.className='meta';meta.textContent=book.collection||'';el.append(link,title,meta);const discover=document.createElement('a');discover.className='text-link buy';discover.href='./'+encodeURIComponent(book.slug)+'/';discover.textContent='Descobrir →';el.appendChild(discover);return el}published.forEach(b=>document.getElementById('publishedGrid').appendChild(card(b)))})();</script>

</body></html>
