<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Editorial Vault | MAISON JF®</title>
<link rel="stylesheet" href="../maison.css">
<style>
body{background:#080808}.admin{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:64px 0 120px}
.admin h1{font:400 clamp(42px,6vw,76px)/.95 var(--serif);margin:.15em 0}.admin p{color:#aaa39a}
.panel{border:1px solid var(--line);padding:22px;margin-top:22px;background:#10100f}
.top{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}
.field{display:grid;gap:7px}.field label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9b948a}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);background:#090909;color:#eee}
#plan-file{display:none}
button{padding:12px 15px;border:1px solid #d8d0c2;background:transparent;color:#eee;cursor:pointer;font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase}
button.primary{background:#eee8dd;color:#111}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.muted{color:#827b72;font-size:12px}
.list{display:grid;gap:10px}.card{border:1px solid #282522;background:#0b0b0a;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px}
.card h3{margin:0 0 7px;font-size:12px;letter-spacing:.06em}.meta{font-size:11px;color:#8f887f;margin-bottom:8px}.body{font:16px/1.5 var(--serif);color:#eee9e0}
.empty{padding:28px;text-align:center;color:#8f887f;border:1px dashed #2b2825}.status{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;color:#cfc7bb}
.ok{color:#b8c8ae}.warning{color:#d1a66a}
@media(max-width:760px){.top{grid-template-columns:1fr}.toolbar button{flex:1 1 45%}}
</style>
</head>
<body>
<main class="admin">
<p class="eyebrow">MAISON JF® · privado</p>
<h1>Editorial Vault</h1>
<p>Os Oceans podem guardar material. Só tu o tornas live. A auditoria completa permite inspecionar conteúdo antigo e publicado. Retirar não apaga o texto nem o histórico editorial.</p>

<section class="panel">
  <div class="top">
    <div class="field"><label for="secret">Chave privada</label><input id="secret" type="password" autocomplete="off" placeholder="Secret do Vault"></div>
    <div class="field"><label for="type">Tipo</label><select id="type"><option value="all">Tudo</option><option value="question">Perguntas</option><option value="oracle_block">Oráculo</option></select></div>
    <div class="field"><label for="state">Estado</label><select id="state"><option value="candidate">Candidatos</option><option value="review">Em revisão</option><option value="candidate-review">Candidatos + revisão</option><option value="live" disabled>Publicadas (live)</option><option value="retired" disabled>Retiradas</option><option value="all" disabled>Todo o Vault</option></select></div>
    <button id="load" class="primary">Carregar</button>
  </div>

  <div class="muted" style="margin-top:16px"><label><input id="audit-mode" type="checkbox"> Auditoria completa: inclui conteúdo live, antigo, candidato e retirado. Os corpos pagos continuam acessíveis apenas com a chave privada.</label></div>

  <div class="toolbar">
    <button id="seed" disabled title="A geração de conteúdo genérico a partir de sinais foi desativada.">Seed automático desativado</button>
    <button id="select-all">Selecionar visíveis</button>
    <button id="clear">Limpar seleção</button>
    <button id="approve" class="primary">Aprovar selecionados</button>
    <button id="approve-all" disabled title="A aprovação em massa fica suspensa até concluir a auditoria do conteúdo existente.">Aprovar TODOS (suspenso)</button>
    <button id="review">Guardar para rever</button>
  <button id="prev-page" disabled>Anterior</button>
  <button id="next-page" disabled>Seguinte</button>
  <button id="export-audit" disabled>Exportar auditoria JSON</button>
  <button id="retire-selected" disabled>Retirar selecionados</button>
  <button id="quarantine-selected" disabled>Suspender para revisão</button>
  </div>

  <div class="toolbar" aria-label="Aplicar plano de triagem">
    <button id="choose-plan">Carregar plano JSON</button>
    <input id="plan-file" type="file" accept=".json,application/json">
    <button id="apply-plan" disabled>Aplicar plano carregado</button>
    <span class="muted" id="plan-summary">Nenhum plano carregado.</span>
  </div>

  <div class="muted" id="vault-summary">Vault: a verificar…</div>
  <div class="muted" id="count">0 itens neste filtro</div>
  <div class="status" id="status"></div>
  <div class="list" id="list"></div>
</section>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id);
 const secret=$('secret'),type=$('type'),state=$('state'),list=$('list'),status=$('status'),count=$('count'),vaultSummary=$('vault-summary');
 let rows=[];
 let auditMode=false,auditOffset=0,auditTotal=0,loadedPlan=null;
 const AUDIT_PAGE_SIZE=100,AUDIT_EXPORT_MAX=5000;
 secret.value=sessionStorage.getItem('maisonVaultAdminSecret')||'';

 function note(value,cls=''){
   status.className='status '+cls;
   status.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);
 }
 async function call(action,extra={}){
   const key=secret.value.trim();
   if(!key)throw new Error('Escreve a chave privada.');
   sessionStorage.setItem('maisonVaultAdminSecret',key);
   const r=await fetch('/api/vault-candidate-admin',{
     method:'POST',
     headers:{'content-type':'application/json','x-maison-admin-key':key},
     body:JSON.stringify({action,...extra})
   });
   const body=await r.json().catch(()=>({error:'Resposta inválida.'}));
   if(!r.ok)throw new Error(body.error||('HTTP '+r.status));
   return body;
 }
 function selected(){
   return [...document.querySelectorAll('.pick:checked')].map(x=>({
     content_type:x.dataset.type,content_id:x.dataset.id
   }));
 }
 function updateCount(){
   count.textContent=auditMode
     ? (rows.length?'A mostrar '+(auditOffset+1)+'–'+(auditOffset+rows.length)+' de '+auditTotal+' registos · ':'')+selected().length+' selecionados para auditoria'
     : rows.length+' itens neste filtro · '+selected().length+' selecionados';
   $('approve').disabled=auditMode||selected().length===0;
   $('review').disabled=auditMode||selected().length===0;
   $('approve-all').disabled=true;
   $('export-audit').disabled=!auditMode;
   $('retire-selected').disabled=!auditMode||selected().length===0;
   $('quarantine-selected').disabled=!auditMode||selected().length===0;
   $('prev-page').disabled=!auditMode||auditOffset===0;
   $('next-page').disabled=!auditMode||(auditOffset+rows.length)>=auditTotal;
 }
 async function loadStats(){
   const r=await call('stats');
   vaultSummary.textContent='Vault total: '+r.total+' · candidatos: '+r.candidates+' · revisão: '+r.review+' · live: '+r.live+
     ' · perguntas: '+r.all_questions+' · Oráculo: '+r.all_oracle_blocks;
 }
 function render(){
   updateCount();
   list.innerHTML='';
   if(!rows.length){list.innerHTML='<div class="empty">Não há material neste filtro.</div>';return}
   for(const x of rows){
     const card=document.createElement('label');
     card.className='card';
     const pick=document.createElement('input');
     pick.type='checkbox';pick.className='pick';pick.dataset.type=x.content_type;pick.dataset.id=x.content_id;
     pick.addEventListener('change',updateCount);
     const wrap=document.createElement('div');
     const h=document.createElement('h3');
     h.textContent=(x.content_type==='question'?'PERGUNTA':'ORÁCULO')+' · '+x.area+' · '+x.stage_or_role;
     const meta=document.createElement('div');meta.className='meta';
     meta.textContent=[x.exposure,x.source_ocean_id,x.source_kind,x.status,x.lifecycle_state,x.created_at].filter(Boolean).join(' · ');
     const body=document.createElement('div');body.className='body';body.textContent=x.text;
     wrap.append(h,meta,body);card.append(pick,wrap);list.append(card);
   }
 }
 async function load(){
   try{
     note('A carregar…');
     await loadStats();
     if(auditMode){
       const r=await call('audit-list',{type:type.value,state:state.value,limit:AUDIT_PAGE_SIZE,offset:auditOffset});
       rows=r.items||[];auditTotal=Number(r.total||0);
       render();
       note('Auditoria privada carregada. Nada foi alterado. Exporta o JSON para rever o conteúdo em lote.','ok');
     }else{
       const listState=state.value==='candidate-review'?'all':state.value;
       const r=await call('list',{type:type.value,state:listState,limit:500});
       rows=r.items||[];auditTotal=rows.length;auditOffset=0;
       render();
       note('Fila editorial carregada. Só aparecem candidatos dos Oceans e itens em revisão.','ok');
     }
   }catch(e){note(e.message,'warning')}
 }
 async function apply(action,items){
   if(!items.length)return note('Seleciona pelo menos um item.','warning');
   try{
     note('A gravar decisão…');
     const r=await call(action,{items});
     note(r,'ok');await load();
   }catch(e){note(e.message,'warning')}
 }
 $('load').addEventListener('click',load);
 $('audit-mode').addEventListener('change',()=>{
   auditMode=$('audit-mode').checked;
   auditOffset=0;auditTotal=0;
   for(const value of ['live','retired','all'])state.querySelector('option[value="'+value+'"]').disabled=!auditMode;
   state.value=auditMode?'all':'candidate';
   load();
 });
 $('state').addEventListener('change',()=>{auditOffset=0;load()});
 $('type').addEventListener('change',()=>{auditOffset=0;load()});
 $('prev-page').addEventListener('click',()=>{if(!auditMode)return;auditOffset=Math.max(0,auditOffset-AUDIT_PAGE_SIZE);load()});
 $('next-page').addEventListener('click',()=>{if(!auditMode||auditOffset+rows.length>=auditTotal)return;auditOffset+=AUDIT_PAGE_SIZE;load()});
 $('export-audit').addEventListener('click',async()=>{
   if(!auditMode)return;
   try{
     if(auditTotal>AUDIT_EXPORT_MAX)throw new Error('O filtro tem '+auditTotal+' registos. Exporta por tipo ou estado, até '+AUDIT_EXPORT_MAX+' de cada vez.');
     const all=[];
     for(let offset=0;offset<auditTotal;offset+=AUDIT_PAGE_SIZE){
       note('A preparar exportação privada: '+Math.min(offset+AUDIT_PAGE_SIZE,auditTotal)+' / '+auditTotal+'…');
       const page=await call('audit-list',{type:type.value,state:state.value,limit:AUDIT_PAGE_SIZE,offset});
       all.push(...(page.items||[]));
     }
     const bundle={schema:'maison-vault-audit-v1',exportedAt:new Date().toISOString(),filters:{type:type.value,state:state.value},total:all.length,items:all};
     const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json;charset=utf-8'});
     const objectUrl=URL.createObjectURL(blob);
     const link=document.createElement('a');
     link.href=objectUrl;link.download='maison-vault-audit-'+type.value+'-'+state.value+'.json';
     document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);
     note('Exportação concluída: '+all.length+' registos. O ficheiro foi criado no teu dispositivo e não foi guardado no GitHub.','ok');
   }catch(e){note(e.message,'warning')}
 });
 $('retire-selected').addEventListener('click',async()=>{
   const items=selected();
   if(!auditMode||!items.length)return;
   const reason=prompt('Motivo editorial para retirar estes '+items.length+' registos. O texto e o histórico serão preservados.','Sem adequação ao produto; conteúdo a retirar após auditoria.');
   if(reason===null)return;
   if(!confirm('Retirar '+items.length+' registos da selecção futura? O texto não será apagado; será preservado o histórico e a decisão editorial.'))return;
   try{
     note('A retirar registos selecionados…');
     const result=await call('retire',{items,reason:reason.trim()});
     note(result,'ok');
     auditOffset=0;await load();
   }catch(e){note(e.message,'warning')}
 });
 $('choose-plan').addEventListener('click',()=>$('plan-file').click());
 $('plan-file').addEventListener('change',async()=>{
   const file=$('plan-file').files&&$('plan-file').files[0];
   loadedPlan=null;$('apply-plan').disabled=true;
   $('plan-summary').textContent='Nenhum plano carregado.';
   if(!file)return;
   try{
     const raw=JSON.parse(await file.text());
     const schemas={
       'maison-vault-proposed-retirement-v1':{action:'retire',label:'retirada da seleção live',sourceKind:'ocean_seed_candidate',qualityVersion:''},
       'maison-vault-proposed-quarantine-v1':{action:'quarantine',label:'suspensão temporária para revisão',sourceKind:'ocean_mcp_candidate',qualityVersion:''},
       'maison-vault-proposed-quarantine-import-batch-v1':{action:'quarantine',label:'suspensão do lote amor-001 para revisão',sourceKind:'maison_private_import',qualityVersion:'private-import:amor-001:v1'}
     };
     const selectedSchema=schemas[raw.schema];
     if(!selectedSchema)throw new Error('Esquema do plano não reconhecido.');
     if(raw.status!=='PROPOSTA_NAO_APLICADA')throw new Error('O ficheiro não está identificado como proposta pendente.');
     if(!Array.isArray(raw.items)||!raw.items.length)throw new Error('O plano não contém registos.');
     if(raw.items.length>1000)throw new Error('O plano excede o limite seguro de 1000 registos.');
     if(Number(raw.total)!==raw.items.length)throw new Error('A contagem do plano não coincide com os registos.');
     const expectedSource=selectedSchema.sourceKind;
     const expectedQualityVersion=selectedSchema.qualityVersion||'';
     const seen=new Set(),normalized=[];
     for(const item of raw.items){
       if(item?.source_kind!==expectedSource||item?.status!=='active'||item?.lifecycle_state!=='live'||
          (expectedQualityVersion&&item?.quality_version!==expectedQualityVersion)){
         throw new Error('O plano contém um registo fora do âmbito previsto ('+expectedSource+
           (expectedQualityVersion?' / '+expectedQualityVersion:'')+', active/live).');
       }
       const type=String(item?.content_type||'');
       const id=String(item?.content_id||'').trim();
       const valid=type==='question'?/^q_[A-Za-z0-9_-]{4,180}$/.test(id):type==='oracle_block'?/^ob_[A-Za-z0-9_-]{4,180}$/.test(id):false;
       if(!valid)throw new Error('ID ou tipo inválido no plano.');
       const key=type+':'+id;
       if(!seen.has(key)){seen.add(key);normalized.push({content_type:type,content_id:id});}
     }
     loadedPlan={action:selectedSchema.action,label:selectedSchema.label,items:normalized,
       sourceKind:selectedSchema.sourceKind,qualityVersion:selectedSchema.qualityVersion||'',
       reason:String(raw.reason||'Plano de triagem MAISON JF').slice(0,1000),schema:raw.schema};
     $('apply-plan').disabled=false;
     $('plan-summary').textContent=normalized.length+' registos · '+selectedSchema.label+' · '+file.name;
     note('Plano carregado para pré-visualização. Nada foi alterado; clica em Aplicar plano carregado para confirmar a operação.','ok');
   }catch(e){
     loadedPlan=null;$('apply-plan').disabled=true;
     $('plan-summary').textContent='Plano inválido.';
     note(e.message,'warning');
   }
 });
 $('apply-plan').addEventListener('click',async()=>{
   if(!loadedPlan)return;
   const verb=loadedPlan.action==='retire'?'RETIRAR DA SELEÇÃO LIVE':'MOVER PARA REVISÃO TEMPORÁRIA';
   const confirmText=verb+' '+loadedPlan.items.length+' registos?\n\nO texto e o histórico não serão apagados.\nMotivo: '+loadedPlan.reason+'\n\nEsta operação altera o estado no Vault privado.';
   if(!confirm(confirmText))return;
   try{
     note('A aplicar plano: '+loadedPlan.items.length+' registos…');
     const result=await call(loadedPlan.action,{items:loadedPlan.items,reason:loadedPlan.reason,sourceKind:loadedPlan.sourceKind,qualityVersion:loadedPlan.qualityVersion});
     loadedPlan=null;$('apply-plan').disabled=true;$('plan-file').value='';
     $('plan-summary').textContent='Plano aplicado; carrega o próximo ficheiro se necessário.';
     note(result,'ok');
     auditOffset=0;await load();
   }catch(e){note(e.message,'warning')}
 });
 $('quarantine-selected').addEventListener('click',async()=>{
   const items=selected();
   if(!auditMode||!items.length)return;
   const reason=prompt('Motivo para suspender os candidatos Ocean selecionados até revisão editorial.','Geração automática Ocean; validar PT-PT, qualidade e destino editorial.');
   if(reason===null)return;
   if(!confirm('Suspender '+items.length+' registos elegíveis de origem ocean_mcp_candidate? Outros tipos de origem serão ignorados. O texto e o histórico serão preservados.'))return;
   try{
     note('A mover candidatos Ocean para revisão…');
     const result=await call('quarantine',{items,reason:reason.trim()});
     note(result,'ok');auditOffset=0;await load();
   }catch(e){note(e.message,'warning')}
 });
 $('seed').addEventListener('click',async()=>{
   if(!confirm('Criar agora candidatos privados a partir dos Oceans existentes? Nada será publicado automaticamente.'))return;
   try{
     note('A puxar os Oceans para o Vault…');
     const r=await call('seed');
     note(r,'ok');
     state.value='candidate';type.value='all';
     await load();
   }catch(e){note(e.message,'warning')}
 });
 $('select-all').addEventListener('click',()=>{document.querySelectorAll('.pick').forEach(x=>x.checked=true);updateCount()});
 $('clear').addEventListener('click',()=>{document.querySelectorAll('.pick').forEach(x=>x.checked=false);updateCount()});
 $('approve').addEventListener('click',()=>{
   const items=selected();
   if(items.length && confirm('Aprovar '+items.length+' itens e torná-los live?'))apply('activate',items);
 });
 $('review').addEventListener('click',()=>{
   const items=selected();
   if(items.length && confirm('Guardar '+items.length+' itens para revisão? Nada será apagado.'))apply('review',items);
 });
 $('approve-all').addEventListener('click',async()=>{
   if(!confirm('Aprovar TODOS os candidatos Ocean elegíveis deste tipo?'))return;
   try{
     note('A aprovar em lote…');
     const r=await call('activate',{all:true,type:type.value});
     note(r,'ok');await load();
   }catch(e){note(e.message,'warning')}
 });
 if(secret.value)load();
})();
</script>
</body>
</html>
