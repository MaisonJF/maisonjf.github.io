<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Consulta confirmada | MAISON JF®</title>
<link rel="stylesheet" href="./maison.css?v=20260925-experience5">
<script src="./analytics.js" defer></script>
<style>
.receipt{min-height:100svh;padding:150px 0 100px;display:grid;place-items:center}
.receipt__card{width:min(780px,100%);border:1px solid var(--line);background:#10100f;padding:clamp(30px,6vw,70px)}
.receipt h1{font:400 clamp(48px,7vw,86px)/.94 var(--serif);margin:.2em 0}
.receipt p{color:#aaa39a}.receipt__details{color:#e9e2d8!important}
.receipt__actions{display:flex;gap:18px;flex-wrap:wrap;margin-top:34px;align-items:center}@media(max-width:560px){.receipt__actions{display:grid;grid-template-columns:1fr;gap:14px}.receipt__actions .button{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="./">MAISON JF®</a><nav><a href="./servicos/">Serviços</a><a href="./produtos/">Produtos</a></nav></header>
<main class="receipt shell">
<section class="receipt__card">
<p class="eyebrow">MAISON JF®</p>
<h1 id="title">A confirmar a compra…</h1>
<p id="message">Só um instante.</p>
<p class="receipt__details" id="details"></p>
<p id="next">Depois da confirmação, combinamos o próximo passo.</p>
<div class="receipt__actions">
<a class="button button--light" id="whatsapp" target="_blank" rel="noopener noreferrer">CONTINUAR NO WHATSAPP</a>
<a class="text-link" href="./servicos/">Voltar aos Serviços</a>
</div>
</section>
</main>
<script>
(()=>{
  const title=document.getElementById('title');
  const message=document.getElementById('message');
  const details=document.getElementById('details');
  const whatsapp=document.getElementById('whatsapp');
  const sessionId=new URLSearchParams(location.search).get('session_id');
  const money=(amount,currency='eur')=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:currency.toUpperCase(),minimumFractionDigits:0,maximumFractionDigits:2}).format(amount/100);
  whatsapp.href='https://wa.me/351923318289?text='+encodeURIComponent('Olá Maison JF. Acabei de concluir o pagamento de uma consulta no site e quero combinar o próximo passo.');
  if(!sessionId){
    title.textContent='Não encontrei a compra.';
    message.textContent='Volta aos Serviços e inicia o pagamento novamente.';
    return;
  }
  fetch('/api/consultation-checkout-session-live?session_id='+encodeURIComponent(sessionId),{cache:'no-store'})
    .then(async response=>{
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error||'Não foi possível confirmar a compra.');
      return data;
    })
    .then(data=>{
      if(data.payment_status==='paid'){
        title.textContent='Pagamento confirmado.';
        message.textContent='A tua compra de '+data.service_name+' ficou confirmada.';
        document.getElementById('next').textContent='Agora fala connosco no WhatsApp para combinarmos o próximo passo.';
        const parts=[];
        if(Number.isInteger(data.amount_total))parts.push('Total: '+money(data.amount_total,data.currency));
        if(data.email)parts.push('Email: '+data.email);
        details.textContent=parts.join(' · ');
        window.maisonAnalytics?.track?.('purchase',{
          transaction_id:sessionId,
          value:Number.isInteger(data.amount_total)?data.amount_total/100:undefined,
          currency:(data.currency||'EUR').toUpperCase(),
          items:[{item_id:data.service_slug,item_name:data.service_name}]
        });
        fetch('/api/checkout-receipt-live',{
          method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({session_id:sessionId})
        }).catch(()=>{});
      }else if(data.status==='complete'){
        title.textContent='Compra concluída. Pagamento a confirmar.';
        message.textContent='A Stripe ainda está a confirmar o pagamento. Atualiza esta página dentro de alguns instantes.';
      }else{
        title.textContent='Pagamento ainda não concluído.';
        message.textContent='A compra ainda não aparece como paga.';
      }
    })
    .catch(error=>{
      title.textContent='Não foi possível confirmar automaticamente.';
      message.textContent=error.message;
    });
})();
</script>
</body>
</html>
