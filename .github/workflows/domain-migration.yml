name: Domain migration cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace legacy GitHub Pages URLs
        shell: bash
        run: |
          git grep -Il 'https://maisonjf.github.io' -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp' ':!*.svg' | while IFS= read -r file; do
            sed -i 's#https://maisonjf\.github\.io#https://maison-jf.com#g' "$file"
          done
          rm -f .github/workflows/domain-migration.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'Maison JF Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Substitui URLs antigas do GitHub Pages pelo domínio oficial'
          git push
