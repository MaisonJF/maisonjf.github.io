name: Maison Intelligence Runtime Deploy
run-name: Maison Intelligence Runtime Deploy

on:
  workflow_dispatch:
    inputs:
      seed_editorial_vault:
        description: "Explicitly seed only missing private Vault candidates from existing Oceans"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'workers/maison-intelligence/src/**'
      - 'workers/maison-intelligence/test/**'
      - 'workers/maison-intelligence/wrangler.jsonc'
      - 'workers/maison-intelligence/package.json'
      - '.github/workflows/maison-ocean-memory-deploy.yml'
      - '.github/maison-growth/brain/migrations/0023_candidate_inbox.sql'

permissions:
  contents: read

concurrency:
  group: maison-ocean-memory-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker tooling
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts

      - name: Validate Worker runtime
        working-directory: workers/maison-intelligence
        run: |
          npm test
          npm run check

      # Ocean working memory 0022 is a hard runtime dependency of /internal/oceans/snapshot.
      # Re-apply the idempotent migration before every deploy so a fresh/partial D1
      # cannot receive code that expects missing Ocean tables/views.
      - name: Ensure Ocean working memory schema 0022
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sed -E '/^[[:space:]]*--/d; /^[[:space:]]*PRAGMA foreign_keys/d'             ../../.github/maison-growth/brain/migrations/0022_ocean_working_memory.sql > "$tmp"
          npx wrangler d1 execute maison-growth-engine --remote --file="$tmp"
          npx wrangler d1 execute maison-growth-engine --remote --command="
            SELECT
              CASE
                WHEN EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='ocean_memory_signals')
                 AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='ocean_memory_state')
                 AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='ocean_memory_alerts')
                 AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='view' AND name='brain_ocean_memory_feed')
                 AND EXISTS(SELECT 1 FROM schema_state WHERE schema_key='maison_ocean_memory_schema_version' AND schema_value='OCEAN.1')
                THEN 'OCEAN.1_READY'
                ELSE 'OCEAN.1_MISSING'
              END AS ocean_schema_status;
          " | tee /tmp/ocean-schema-check.txt
          grep -q 'OCEAN.1_READY' /tmp/ocean-schema-check.txt

      # Candidate Inbox 0023 is an idempotent runtime dependency for the Foundry.
      # Apply only this reviewed CREATE IF NOT EXISTS migration before code deploy.
      - name: Ensure Candidate Inbox schema 0023
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sed -E '/^[[:space:]]*--/d; /^[[:space:]]*PRAGMA foreign_keys/d' \
            ../../.github/maison-growth/brain/migrations/0023_candidate_inbox.sql > "$tmp"
          npx wrangler d1 execute maison-growth-engine --remote --file="$tmp"
          npx wrangler d1 execute maison-growth-engine --remote --command="SELECT schema_value FROM schema_state WHERE schema_key='maison_candidate_inbox_schema_version';"

      - name: Seed Editorial Vault from existing Oceans
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_editorial_vault == true }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          node scripts/seed-editorial-vault-existing-oceans.mjs > "$tmp"
          npx wrangler d1 execute maison-growth-engine --remote --file="$tmp"
          npx wrangler d1 execute maison-growth-engine --remote --command="
            SELECT
              (SELECT COUNT(*) FROM vault_questions WHERE source_kind IN ('ocean_seed_candidate','ocean_mcp_candidate') AND status='candidate' AND lifecycle_state='candidate') AS question_candidates,
              (SELECT COUNT(*) FROM vault_oracle_blocks WHERE source_kind IN ('ocean_seed_candidate','ocean_mcp_candidate') AND status='candidate' AND lifecycle_state='candidate') AS oracle_candidates,
              (SELECT COUNT(*) FROM vault_questions) AS all_questions,
              (SELECT COUNT(*) FROM vault_oracle_blocks) AS all_oracle_blocks;
          "

      - name: Non-writing OSIRIS Memory bridge smoke test
        id: osiris_bridge
        env:
          OSIRIS_MEMORY_BRIDGE_URL: ${{ secrets.MAISON_OSIRIS_MEMORY_BRIDGE_URL }}
          MAISON_OSIRIS_BRIDGE_TOKEN: ${{ secrets.MAISON_OSIRIS_BRIDGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OSIRIS_MEMORY_BRIDGE_URL" || -z "$MAISON_OSIRIS_BRIDGE_TOKEN" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OSIRIS Memory bridge credentials are not configured; keeping remote Memory disabled."
            echo "- OSIRIS Memory: disabled (bridge credentials not configured)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python .github/maison-growth/runtime/smoke_osiris_memory_bridge.py; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "- OSIRIS Memory: HTTPS/Bearer smoke test passed; the invalid test envelope was rejected without a write." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OSIRIS Memory bridge smoke test did not pass; keeping remote Memory disabled."
            echo "- OSIRIS Memory: disabled (non-writing bridge smoke test failed)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Render live private Worker config
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          OSIRIS_MEMORY_BRIDGE_URL: ${{ secrets.MAISON_OSIRIS_MEMORY_BRIDGE_URL }}
          OSIRIS_BRIDGE_ENABLED: ${{ steps.osiris_bridge.outputs.enabled }}
        shell: bash
        run: |
          set -euo pipefail
          bridge_args=()
          if [[ "$OSIRIS_BRIDGE_ENABLED" == "true" ]]; then
            bridge_args+=(--bridge-smoke-test-passed --osiris-memory-bridge-url "$OSIRIS_MEMORY_BRIDGE_URL")
          fi
          python .github/maison-growth/runtime/render_private_worker_config.py \
            private_observe_candidate \
            --template workers/maison-intelligence/wrangler.jsonc \
            --private-url "$BRAIN_CONTROL_API_URL" \
            "${bridge_args[@]}" \
            --output workers/maison-intelligence/wrangler.private.runtime.jsonc

      - name: Guard Cloudflare Workers variable limit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("workers/maison-intelligence/wrangler.private.runtime.jsonc")
          config = json.loads(path.read_text(encoding="utf-8"))
          variables = config.get("vars", {})
          if not isinstance(variables, dict):
              raise SystemExit("Worker config 'vars' must be a JSON object")

          count = len(variables)
          limit = 64
          # The current private runtime already has six worker secrets. The gated
          # OSIRIS Memory profile may add one bridge token, so budget seven slots.
          reserved_secret_slots = 7
          estimated_total = count + reserved_secret_slots
          print(f"Worker text variables: {count}; reserved secret slots: {reserved_secret_slots}; estimated combined total: {estimated_total}/{limit}")
          print("Configured variable names: " + ", ".join(sorted(variables)))
          if estimated_total > limit:
              raise SystemExit(
                  f"Cloudflare Workers Free limit exceeded: estimated {estimated_total} variables/secrets; "
                  f"reduce the configuration to {limit - reserved_secret_slots} text variables or fewer."
              )
          if estimated_total >= 63:
              print("::warning::Worker config is near the combined 64-variable limit; review secret additions before deployment.")
          PY

      - name: Deploy Maison intelligence runtime
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OSIRIS_MEMORY_BRIDGE_TOKEN: ${{ secrets.MAISON_OSIRIS_BRIDGE_TOKEN }}
          OSIRIS_BRIDGE_ENABLED: ${{ steps.osiris_bridge.outputs.enabled }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OSIRIS_BRIDGE_ENABLED" == "true" ]]; then
            test -n "$OSIRIS_MEMORY_BRIDGE_TOKEN"
            printf '%s' "$OSIRIS_MEMORY_BRIDGE_TOKEN" | npx wrangler secret put OSIRIS_MEMORY_BRIDGE_TOKEN --config wrangler.private.runtime.jsonc
          fi
          npx wrangler deploy --config wrangler.private.runtime.jsonc

      - name: Verify Worker health without D1 read
        shell: bash
        env:
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          base="${MAISON_BRAIN_PRIVATE_URL%/}"
          access_id="$CF_ACCESS_CLIENT_ID"
          access_secret="$CF_ACCESS_CLIENT_SECRET"
          shopt -s nocasematch
          if [[ "$access_id" =~ ^CF-Access-Client-Id:[[:space:]]*(.*)$ ]]; then access_id="${BASH_REMATCH[1]}"; fi
          if [[ "$access_secret" =~ ^CF-Access-Client-Secret:[[:space:]]*(.*)$ ]]; then access_secret="${BASH_REMATCH[1]}"; fi
          shopt -u nocasematch

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $BRAIN_CONTROL_TOKEN" \
            --header "CF-Access-Client-Id: $access_id" \
            --header "CF-Access-Client-Secret: $access_secret" \
            "$base/internal/brain/health")"
          cat "$body"
          test "$status" = "200"
          python - "$body" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as fh:
              payload=json.load(fh)
          assert payload.get('status')=='ok',payload
          assert payload.get('mode')=='read_only',payload
          print('Worker health without D1 read: OK')
          PY

          mcp_body="$(mktemp)"
          mcp_status="$(curl --silent --show-error --output "$mcp_body" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "CF-Access-Client-Id: $access_id" \
            --header "CF-Access-Client-Secret: $access_secret" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            "$base/mcp")"
          cat "$mcp_body"
          test "$mcp_status" = "200"
          python - "$mcp_body" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as fh:
              payload=json.load(fh)
          names={tool.get('name') for tool in payload.get('result',{}).get('tools',[])}
          required={'maison_ingest_ocean_signal','maison_ingest_vault_candidate','maison_ingest_candidate','maison_list_candidates','maison_decide_candidate'}
          missing=required-names
          assert not missing,{'missing_mcp_tools':sorted(missing),'available':sorted(names)}
          print('Live MCP D1 tools: OK')
          PY

          oauth_body="$(mktemp)"
          oauth_status="$(curl --silent --show-error --output "$oauth_body" --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "CF-Access-Client-Id: $access_id" \
            --header "CF-Access-Client-Secret: $access_secret" \
            "$base/.well-known/oauth-protected-resource")"
          cat "$oauth_body"
          if test "$oauth_status" = "200"; then
            python - "$oauth_body" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as fh:
              payload=json.load(fh)
          assert payload.get('resource','').endswith('/mcp'),payload
          servers=payload.get('authorization_servers') or []
          assert servers and all(str(x).startswith('https://') for x in servers),payload
          print('Live MCP OAuth metadata: OK')
          PY
          else
            python - "$oauth_body" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as fh:
              payload=json.load(fh)
          assert payload.get('error')=='mcp_auth_not_configured',payload
          print('Live MCP OAuth metadata: optional auth not configured; internal D1 runtime remains active')
          PY
          fi
