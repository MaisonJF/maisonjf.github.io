name: Maison D1 Apply Reviewed 0012-0016

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Apply the reviewed missing D1 migrations 0012-0016
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apply-reviewed-migrations:
    if: ${{ inputs.confirm_apply }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard dedicated D1 write credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Worker tooling
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts

      - name: Apply reviewed missing migrations 0012-0016
        working-directory: workers/maison-intelligence
        run: bash scripts/apply-reviewed-0012-0016.sh maison-growth-engine --confirm-reviewed-0012-0016

      - name: Verify complete 0001-0016 schema read-only
        working-directory: workers/maison-intelligence
        run: bash scripts/inspect-growth-migrations.sh maison-growth-engine

      - name: Verify required runtime schema surfaces
        working-directory: workers/maison-intelligence
        run: bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Summarize controlled D1 migration
        shell: bash
        run: |
          {
            echo "## Maison D1 reviewed migration apply"
            echo
            echo "- Database: maison-growth-engine"
            echo "- Applied: 0012 through 0016"
            echo "- Post-apply schema verification: passed"
            echo "- Worker deployed: false"
            echo "- External collection activated: false"
            echo "- Outbound authority enabled: false"
            echo "- Spend authority enabled: false"
          } >> "$GITHUB_STEP_SUMMARY"
