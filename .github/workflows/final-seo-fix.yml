name: Final SEO fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-seo-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove remaining legacy domain reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https%3A%2F%2Fmaisonjf.github.io%2F', 'https%3A%2F%2Fmaison-jf.com%2F')
          s = s.replace('https://maisonjf.github.io/', 'https://maison-jf.com/')
          s = s.replace('https://maisonjf.github.io', 'https://maison-jf.com')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/final-seo-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fecha limpeza SEO e remove domínio antigo"
          git push
