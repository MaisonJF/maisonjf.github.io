name: Bootstrap Editorial Vault

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-editorial-vault.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Build private seed SQL from existing Ocean metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const root=JSON.parse(fs.readFileSync('.github/maison-growth/oceans/candidates.json','utf8'));
          const oceans=Array.isArray(root)?root:(root.candidates||[]);
          const q=o=>String(o??'').replace(/'/g,"''");
          const fp=s=>crypto.createHash('sha256').update(String(s).normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim()).digest('hex').slice(0,40);
          const json=v=>q(JSON.stringify(v));
          const sql=['BEGIN;'];

          for(const ocean of oceans){
            const id=String(ocean.territory||'').trim();
            if(!id||ocean.questionPotential!==true)continue;
            const themes=Array.isArray(ocean.questionThemeCandidates)?ocean.questionThemeCandidates.filter(Boolean).map(String):[];
            for(const variant of [1,2]){
              const theme=String(themes[variant-1]||themes[0]||id).slice(0,120);
              const text=variant===1
                ? `Quando aparece a sensação de «${theme}», o que costumas fazer primeiro — aproximar-te do que precisas ou afastar-te disso?`
                : `Se «${theme}» não precisasse de ser resolvido já, o que gostarias de perceber melhor sobre ti nessa situação?`;
              const questionId=`q_ocean_${id}_${variant}`;
              const stage=variant===1?'recognize':'deepen';
              const decisionId=`dec_ocean_${id}_q${variant}`;
              sql.push(`INSERT OR IGNORE INTO vault_questions
                (question_id,canonical_key,theme,text,subthemes_json,class,stage,intensity,direction,time_scope,
                 exposure,status,scores_json,viral_json,conflicts_json,pairs_json,similarity_group,source_kind,
                 pain_family,subterritory,target,emotional_function,cognitive_load,vulnerability,conflict_potential,
                 playfulness,semantic_fingerprint,compatibility_json,product_fit_json,lifecycle_state,rotation_state,
                 source_ocean_id,quality_version)
                VALUES('${q(questionId)}','${q('ocean:'+id+':q'+variant)}','${q(theme)}','${q(text)}','${json(themes.slice(0,8))}',
                'mirror','${stage}',2,'either','timeless','paid','candidate',
                '{"clarity":4,"conversationValue":4,"safety":5,"editorialQuality":3,"humanity":4,"composability":4}',
                '{}','[]','[]','${q(id)}','ocean_mcp_candidate','${q(theme)}','${q(theme)}','both','discovery',2,2,2,2,
                '${fp(text)}','{}','{"para_de_ignorar":1,"source":"ocean_bootstrap"}','candidate','new','${q(id)}','ocean-bootstrap-v1');`);
              sql.push(`INSERT OR IGNORE INTO vault_editorial_decisions
                (decision_id,content_type,content_id,decision,reason_code,details_json,engine_version)
                VALUES('${q(decisionId)}','question','${q(questionId)}','propose','ocean_bootstrap','{"source_ocean_id":"${q(id)}"}','ocean-bootstrap-v1');`);
            }

            if(ocean.oraclePotential===true){
              const pain=String(ocean.painLanguage||'').trim();
              const title=String(themes[0]||id).slice(0,180);
              const text=`${pain} Antes de tentares resolver isto, repara no que estás a proteger, no que estás a adiar e no que já sabes mas tens evitado nomear. O movimento não é forçar uma resposta; é tornar mais claro o lugar de onde estás a escolher.`;
              const blockId=`ob_ocean_${id}`;
              const decisionId=`dec_ocean_${id}_oracle`;
              sql.push(`INSERT OR IGNORE INTO vault_oracle_blocks
                (block_id,canonical_key,territory,role,intensity,text,status,compatibility_json,scores_json,source_kind,
                 title,pain_family,subterritory,tone,emotional_function,semantic_fingerprint,tags_json,product_fit_json,
                 lifecycle_state,rotation_state,rarity,source_ocean_id,quality_version)
                VALUES('${q(blockId)}','${q('ocean:'+id+':oracle')}','${q(id)}','recognition',2,'${q(text)}','candidate','{}',
                '{"clarity":4,"safety":5,"editorialQuality":3,"humanity":4,"composability":4}','ocean_mcp_candidate',
                '${q(title)}','${q(id)}','${q(title)}','intimate','recognition','${fp(text)}','${json(themes.slice(0,12))}',
                '{"oracle":1,"source":"ocean_bootstrap"}','candidate','new','common','${q(id)}','ocean-bootstrap-v1');`);
              sql.push(`INSERT OR IGNORE INTO vault_editorial_decisions
                (decision_id,content_type,content_id,decision,reason_code,details_json,engine_version)
                VALUES('${q(decisionId)}','oracle_block','${q(blockId)}','propose','ocean_bootstrap','{"source_ocean_id":"${q(id)}"}','ocean-bootstrap-v1');`);
            }
          }

          sql.push('COMMIT;');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/bootstrap-editorial-vault.sql',sql.join('\n'));
          NODE

      - name: Seed private D1 candidates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute maison-growth-engine --remote --file="$RUNNER_TEMP/bootstrap-editorial-vault.sql" >/dev/null
          npx wrangler d1 execute maison-growth-engine --remote --command="SELECT COUNT(*) AS candidates FROM vault_questions WHERE source_kind='ocean_mcp_candidate' AND status='candidate'; SELECT COUNT(*) AS oracle_candidates FROM vault_oracle_blocks WHERE source_kind='ocean_mcp_candidate' AND status='candidate';"
