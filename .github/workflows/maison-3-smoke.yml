name: Maison 3.0 smoke checks
on:
  push:
    branches: [maison-3.0]
  pull_request:
    branches: [main]
jobs:
  navigation-and-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check internal links and supported locales
        run: node scripts/maison-3-smoke.cjs
