name: Maison Ocean Snapshot Sync
run-name: Maison Ocean Snapshot Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/maison-growth/oceans/candidates.json'
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: write

concurrency:
  group: maison-ocean-snapshot-sync
  cancel-in-progress: false

jobs:
  rebuild-derived:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild deterministic Ocean derivatives
        run: |
          set -euo pipefail
          node .github/maison-growth/brain/build_editorial_queue.mjs
          node .github/maison-growth/brain/build_editorial_queue.mjs --check
      - name: Commit derived files if changed
        run: |
          set -euo pipefail
          git config user.name "maison-oceans-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- .github/maison-growth/brain/editorial-queue.json functions/_lib/vpc-ocean-signals.generated.js
          if git diff --cached --quiet; then
            echo "Ocean derivatives already coherent."
            exit 0
          fi
          git commit -m "chore(oceans): rebuild deterministic derivatives"
          git pull --rebase origin main
          git push origin HEAD:main

  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read pending Ocean snapshots
        id: feed
        shell: bash
        env:
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          base="${MAISON_BRAIN_PRIVATE_URL%/}"
          access_id="$CF_ACCESS_CLIENT_ID"
          access_secret="$CF_ACCESS_CLIENT_SECRET"
          shopt -s nocasematch
          if [[ "$access_id" =~ ^CF-Access-Client-Id:[[:space:]]*(.*)$ ]]; then access_id="${BASH_REMATCH[1]}"; fi
          if [[ "$access_secret" =~ ^CF-Access-Client-Secret:[[:space:]]*(.*)$ ]]; then access_secret="${BASH_REMATCH[1]}"; fi
          shopt -u nocasematch
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $BRAIN_CONTROL_TOKEN" \
            --header "CF-Access-Client-Id: $access_id" \
            --header "CF-Access-Client-Secret: $access_secret" \
            "$base/internal/oceans/snapshot?limit=100" > /tmp/ocean-feed.json
          count="$(node -e "const x=require('/tmp/ocean-feed.json'); process.stdout.write(String((x.rows||[]).length))")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Export and rebuild allowed Ocean derivatives
        if: steps.feed.outputs.count != '0'
        run: |
          node workers/maison-intelligence/scripts/export-ocean-snapshot.mjs \
            /tmp/ocean-feed.json .github/maison-growth/oceans/candidates.json > /tmp/ocean-sync.json
          node .github/maison-growth/brain/build_editorial_queue.mjs
          node .github/maison-growth/brain/build_editorial_queue.mjs --check

      - name: Commit snapshot atomically
        if: steps.feed.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "maison-oceans-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            .github/maison-growth/oceans/candidates.json \
            .github/maison-growth/brain/editorial-queue.json \
            functions/_lib/vpc-ocean-signals.generated.js
          if git diff --cached --quiet; then
            echo "No repository delta; D1 can still be acknowledged."
          else
            git commit -m "chore(oceans): sync D1 snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node .github/maison-growth/brain/build_editorial_queue.mjs --check

      - name: Acknowledge D1 snapshot
        if: steps.feed.outputs.count != '0'
        shell: bash
        env:
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          base="${MAISON_BRAIN_PRIVATE_URL%/}"
          access_id="$CF_ACCESS_CLIENT_ID"
          access_secret="$CF_ACCESS_CLIENT_SECRET"
          shopt -s nocasematch
          if [[ "$access_id" =~ ^CF-Access-Client-Id:[[:space:]]*(.*)$ ]]; then access_id="${BASH_REMATCH[1]}"; fi
          if [[ "$access_secret" =~ ^CF-Access-Client-Secret:[[:space:]]*(.*)$ ]]; then access_secret="${BASH_REMATCH[1]}"; fi
          shopt -u nocasematch
          keys="$(node -e "const x=require('/tmp/ocean-sync.json'); process.stdout.write(JSON.stringify({ocean_keys:x.synced,state:'synced'}))")"
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $BRAIN_CONTROL_TOKEN" \
            --header "CF-Access-Client-Id: $access_id" \
            --header "CF-Access-Client-Secret: $access_secret" \
            --data "$keys" "$base/internal/oceans/snapshot/mark")"
          cat "$body"
          test "$status" = "200"
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('$body','utf8')); if(x.ok!==true||x.state!=='synced') process.exit(1)"
