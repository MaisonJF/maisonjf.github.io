name: Maison Ocean Alert Query Check
run-name: Maison Ocean Alert Query Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maison-ocean-alert-query-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts
      - name: Check bounded Ocean alert query
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute maison-growth-engine --remote --command "
          SELECT observation_id,event_id,territory_key,provider_id,model_id,source_class,
                 grounding_state,response_excerpt,observed_at,evidence_id,strength,
                 confidence_class,confidence,semantic_observation_id,need_id,intent_id,
                 semantic_confidence_score,semantic_ambiguity,semantic_provider_name,
                 semantic_provider_version,independent_roots_json,evidence_refs_json
          FROM brain_prebrain_feed
          ORDER BY observed_at,observation_id
          LIMIT 1;

          SELECT
            a.alert_id,a.ocean_key,a.signal_id,a.alert_kind,a.priority,a.created_at,
            a.payload_json,s.evidence_roots_json,st.independent_evidence_count
          FROM ocean_memory_alerts a
          JOIN ocean_memory_signals s ON s.signal_id=a.signal_id
          JOIN ocean_memory_state st ON st.ocean_key=a.ocean_key
          WHERE a.delivery_state='pending'
            AND a.created_at >= datetime('now','-72 hours')
          ORDER BY a.priority DESC,a.created_at DESC,a.alert_id DESC
          LIMIT 20;
          "
