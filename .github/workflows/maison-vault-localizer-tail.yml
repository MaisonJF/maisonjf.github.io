name: Maison Vault Localizer Tail

on:
  push:
    branches:
      - rio-produto-digital/vault-localizer
    paths:
      - '.github/workflows/maison-vault-localizer-tail.yml'

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts
      - name: Tail localizer errors across scheduled execution
        working-directory: workers/maison-intelligence
        shell: bash
        run: |
          set -o pipefail
          timeout 85s npx wrangler tail maison-vault-localizer --format pretty 2>&1             | grep -E 'Scheduled Vault localizer failed|Error|exception|cron|scheduled|CPU|AI|D1' || true
