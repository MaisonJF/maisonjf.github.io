name: Maison Private Runtime Live Verify Temporary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maison-private-runtime-live-verify-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Allow Cloudflare Git deployment to settle
        run: sleep 45
      - name: Inspect live Worker setting
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          token=os.environ["CLOUDFLARE_API_TOKEN"].strip()
          url=f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/maison-intelligence/settings"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=15) as r:
              data=json.load(r)
          found={}
          for b in (data.get("result") or {}).get("bindings") or []:
              if b.get("name") in {"BRAIN_CONTROL_API_ENABLED","WORKER_ENABLED","KILL_SWITCH"}:
                  found[b["name"]]=b.get("text")
          print(json.dumps(found,sort_keys=True))
          if found.get("BRAIN_CONTROL_API_ENABLED")!="true":
              raise SystemExit("brain_control_api_not_enabled")
          PY
      - name: Verify live private Brain health
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: python .github/maison-growth/runtime/verify_private_brain_health.py
      - name: Verify live private Brain boundary
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: python .github/maison-growth/runtime/verify_private_brain_boundary.py private_brain_read_candidate
