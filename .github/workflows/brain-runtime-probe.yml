name: Brain Runtime Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production aggregate health
        shell: bash
        run: |
          set -u
          response="$(curl -sS --connect-timeout 10 --max-time 30 -w '\nHTTP_STATUS:%{http_code}\n' https://maison-jf.com/api/engine-health || true)"
          printf '%s\n' "$response"
