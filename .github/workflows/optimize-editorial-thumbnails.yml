name: Optimize editorial thumbnails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-editorial-thumbnails.yml'

permissions:
  contents: write

jobs:
  optimize-editorial-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build poster thumbnails
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          posters = {
              'images/ebooks/posters/virgulas-do-destino.webp': 'virgulas-do-destino',
              'images/ebooks/posters/sombras-da-luz.webp': 'sombras-da-luz',
              'images/ebooks/posters/escrito-nas-entrelinhas.webp': 'escrito-nas-entrelinhas',
              'images/ebooks/posters/sombras-da-alma.webp': 'sombras-da-alma',
              'images/ebooks/posters/casos-cinzentos.webp': 'casos-cinzentos',
              'images/ebooks/posters/desculpa-mas-tu-tambem-fizeste-merda-brevemente.webp': 'desculpa-mas-tu-tambem-fizeste-merda',
          }

          out = Path('images/perf/editorial')
          out.mkdir(parents=True, exist_ok=True)

          for src, name in posters.items():
              path=Path(src)
              if not path.exists():
                  continue
              with Image.open(path) as im:
                  im=im.convert('RGB')
                  ow,oh=im.size
                  for width in (320,520,760):
                      width=min(width,ow)
                      height=round(oh*width/ow)
                      target=out/f'{name}-{width}.webp'
                      resized=im if width==ow else im.resize((width,height),Image.Resampling.LANCZOS)
                      resized.save(target,'WEBP',quality=78,method=6,optimize=True)
                      print(f'{target}: {width}x{height} · {target.stat().st_size/1024:.1f} KB')
          PY
      - name: Commit optimized thumbnails
        shell: bash
        run: |
          if git diff --quiet -- images/perf/editorial && [ -z "$(git ls-files --others --exclude-standard images/perf/editorial)" ]; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/perf/editorial
          git commit -m "Gera thumbnails leves para a biblioteca editorial"
          git push
