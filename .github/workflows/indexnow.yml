name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        run: sleep 90
      - name: Notify IndexNow
        shell: bash
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"maison-jf.com","key":"2e7132dc5767b64308add20a2790e2b6","keyLocation":"https://maison-jf.com/2e7132dc5767b64308add20a2790e2b6.txt","urlList":["https://maison-jf.com/", "https://maison-jf.com/produtos.html", "https://maison-jf.com/servicos.html", "https://maison-jf.com/companhia.html", "https://maison-jf.com/maison-todo-o-mes.html", "https://maison-jf.com/editions.html", "https://maison-jf.com/profissionais.html", "https://maison-jf.com/farol.html"]}' \
            https://api.indexnow.org/indexnow
