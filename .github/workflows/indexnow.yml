name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for Cloudflare Pages deployment
        run: sleep 90
      - name: Notify IndexNow from sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [el.text.strip() for el in root.findall('sm:url/sm:loc', ns) if el.text]

          payload = {
              'host': 'maison-jf.com',
              'key': '2e7132dc5767b64308add20a2790e2b6',
              'keyLocation': 'https://maison-jf.com/2e7132dc5767b64308add20a2790e2b6.txt',
              'urlList': urls,
          }
          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=data,
              headers={'Content-Type': 'application/json; charset=utf-8'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              print('IndexNow status:', response.status)
              print('URLs submitted:', len(urls))
          PY
