name: SEO clean URLs one-off

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-clean-urls-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and validate clean URLs
        run: python3 scripts/seo_clean_urls_once.py
      - name: Commit repair
        run: |
          git config user.name "Maison JF SEO Repair"
          git config user.email "maisonjf@proton.me"
          git rm scripts/seo_clean_urls_once.py
          git add -A
          git diff --cached --check
          git commit -m "SEO: normalize Cloudflare clean URLs and canonical discovery"
          git push origin HEAD:main
