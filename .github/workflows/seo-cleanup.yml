name: SEO technical cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize canonical SEO metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path(x) for x in ['index.html','produtos.html','servicos.html','companhia.html','profissionais.html','farol.html','maison-todo-o-mes.html','editions.html'] if Path(x).exists()]
          for p in files:
              s=p.read_text(encoding='utf-8')
              # Official domain everywhere in public metadata.
              s=s.replace('https://maisonjf.github.io','https://maison-jf.com')
              # Remove obsolete meta keywords if present; modern search engines do not need them.
              s=re.sub(r'\s*<meta\s+name=["\']keywords["\'][^>]*>\s*', '\n', s, flags=re.I)
              # Remove geo targeting metadata: Maison JF is an online-first brand, not a local-only result.
              s=re.sub(r'\s*<meta\s+name=["\']geo\.[^>]*>\s*', '\n', s, flags=re.I)
              s=re.sub(r'\s*<meta\s+name=["\']ICBM["\'][^>]*>\s*', '\n', s, flags=re.I)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/seo-cleanup.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limpa metadados SEO e consolida o domínio oficial"
          git push
