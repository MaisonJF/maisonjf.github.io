name: Maison Private Runtime Deploy

on:
  pull_request:
    paths:
      - '.github/maison-growth/**'
      - 'workers/maison-intelligence/**'
      - '.github/workflows/maison-private-runtime.yml'
  push:
    branches:
      - main
    paths:
      - '.github/maison-growth/**'
      - 'workers/maison-intelligence/**'
      - '.github/workflows/maison-private-runtime.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: Private Brain surface to deploy
        required: true
        type: choice
        options:
          - private_brain_read_candidate
          - proposal_materialization_candidate
          - human_review_decision_candidate
      apply:
        description: Apply to Cloudflare (false = dry-run only)
        required: true
        default: false
        type: boolean
      access_boundary_confirmed:
        description: Confirm authenticated HTTPS/Access boundary is already configured
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  private-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'private_brain_read_candidate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report first-stage credential readiness
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          MAISON_BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN }}
          MAISON_CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          MAISON_CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
          MAISON_BRAIN_PROPOSAL_TOKEN: ${{ secrets.MAISON_BRAIN_PROPOSAL_TOKEN }}
          MAISON_BRAIN_REVIEW_DECISION_TOKEN: ${{ secrets.MAISON_BRAIN_REVIEW_DECISION_TOKEN }}
        run: python .github/maison-growth/runtime/report_private_runtime_readiness.py

      - name: Guard live apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.access_boundary_confirmed }}" != "true" ]]; then
            echo "Refusing apply: authenticated HTTPS/Access boundary was not confirmed."
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Private-stage preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN }}
          BRAIN_PROPOSAL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_PROPOSAL_TOKEN: ${{ secrets.MAISON_BRAIN_PROPOSAL_TOKEN }}
          BRAIN_REVIEW_DECISION_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_REVIEW_DECISION_TOKEN: ${{ secrets.MAISON_BRAIN_REVIEW_DECISION_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: |
          python .github/maison-growth/runtime/preflight_private_runtime.py "$RUNTIME_STAGE"

      - name: Render temporary Wrangler config (dry-run)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.apply }}
        run: |
          python .github/maison-growth/runtime/render_private_worker_config.py \
            "$RUNTIME_STAGE" \
            --template workers/maison-intelligence/wrangler.jsonc \
            --output workers/maison-intelligence/wrangler.private.runtime.jsonc

      - name: Render temporary Wrangler config (live custom domain)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
        run: |
          python .github/maison-growth/runtime/render_private_worker_config.py \
            "$RUNTIME_STAGE" \
            --template workers/maison-intelligence/wrangler.jsonc \
            --private-url "$BRAIN_CONTROL_API_URL" \
            --output workers/maison-intelligence/wrangler.private.runtime.jsonc

      - name: Install Worker tooling
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts

      - name: Verify remote D1 schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Validate Worker
        working-directory: workers/maison-intelligence
        run: |
          npm test
          npm run check
          npx wrangler deploy --dry-run --config wrangler.private.runtime.jsonc

      - name: Install private Worker secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        working-directory: workers/maison-intelligence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN }}
          BRAIN_PROPOSAL_TOKEN: ${{ secrets.MAISON_BRAIN_PROPOSAL_TOKEN }}
          BRAIN_REVIEW_DECISION_TOKEN: ${{ secrets.MAISON_BRAIN_REVIEW_DECISION_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$BRAIN_CONTROL_TOKEN" | npx wrangler secret put BRAIN_CONTROL_TOKEN --config wrangler.private.runtime.jsonc
          case "$RUNTIME_STAGE" in
            proposal_materialization_candidate|human_review_decision_candidate)
              test -n "$BRAIN_PROPOSAL_TOKEN"
              printf '%s' "$BRAIN_PROPOSAL_TOKEN" | npx wrangler secret put BRAIN_PROPOSAL_TOKEN --config wrangler.private.runtime.jsonc
              ;;
          esac
          if [[ "$RUNTIME_STAGE" == "human_review_decision_candidate" ]]; then
            test -n "$BRAIN_REVIEW_DECISION_TOKEN"
            printf '%s' "$BRAIN_REVIEW_DECISION_TOKEN" | npx wrangler secret put BRAIN_REVIEW_DECISION_TOKEN --config wrangler.private.runtime.jsonc
          fi

      - name: Deploy private surface
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.private.runtime.jsonc

      - name: Verify deployed private Brain health
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: python .github/maison-growth/runtime/verify_private_brain_health.py
