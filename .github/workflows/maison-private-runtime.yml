name: Maison Private Runtime Deploy
run-name: Maison Private Runtime Deploy

on:
  pull_request:
    paths:
      - '.github/maison-growth/**'
      - 'workers/maison-intelligence/**'
      - '.github/workflows/maison-private-runtime.yml'
  push:
    branches:
      - main
    paths:
      - '.github/maison-growth/**'
      - 'workers/maison-intelligence/**'
      - '.github/workflows/maison-private-runtime.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: Private Brain surface to deploy
        required: true
        type: choice
        options:
          - private_brain_read_candidate
          - proposal_materialization_candidate
          - human_review_decision_candidate
      apply:
        description: Apply to Cloudflare (false = dry-run only)
        required: true
        default: false
        type: boolean
      access_boundary_confirmed:
        description: Confirm authenticated HTTPS/Access boundary is already configured
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  private-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'private_brain_read_candidate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual deploys must use the current main head, not a stale workflow-dispatch revision.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh derived commercial context
        run: |
          bash .github/maison-growth/brain/rebuild_commercial_context.sh --write

      - name: Validate global health gate
        run: python .github/maison-growth/brain/validate_global_health_gate.py

      - name: Report first-stage credential readiness
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          MAISON_BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          MAISON_CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          MAISON_CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
          MAISON_BRAIN_PROPOSAL_TOKEN: ${{ secrets.MAISON_BRAIN_PROPOSAL_TOKEN }}
          MAISON_BRAIN_REVIEW_DECISION_TOKEN: ${{ secrets.MAISON_BRAIN_REVIEW_DECISION_TOKEN }}
        run: python .github/maison-growth/runtime/report_private_runtime_readiness.py

      - name: Guard live apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.access_boundary_confirmed }}" != "true" ]]; then
            echo "Refusing apply: authenticated HTTPS/Access boundary was not confirmed."
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Private-stage preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          BRAIN_PROPOSAL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_PROPOSAL_TOKEN: ${{ secrets.MAISON_BRAIN_PROPOSAL_TOKEN }}
          BRAIN_REVIEW_DECISION_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_REVIEW_DECISION_TOKEN: ${{ secrets.MAISON_BRAIN_REVIEW_DECISION_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: |
          python .github/maison-growth/runtime/preflight_private_runtime.py "$RUNTIME_STAGE"

      - name: Render temporary Wrangler config (dry-run)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.apply }}
        run: |
          python .github/maison-growth/runtime/render_private_worker_config.py \
            "$RUNTIME_STAGE" \
            --template workers/maison-intelligence/wrangler.jsonc \
            --output workers/maison-intelligence/wrangler.private.runtime.jsonc

      - name: Render temporary Wrangler config (live custom domain)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
        run: |
          python .github/maison-growth/runtime/render_private_worker_config.py \
            "$RUNTIME_STAGE" \
            --template workers/maison-intelligence/wrangler.jsonc \
            --private-url "$BRAIN_CONTROL_API_URL" \
            --output workers/maison-intelligence/wrangler.private.runtime.jsonc

      - name: Install Worker tooling
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts

      - name: Verify remote D1 schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        working-directory: workers/maison-intelligence
        env:
          # D1 schema verification is read-only. Prefer the dedicated D1 read token;
          # fall back to the deploy token only if the read token is unavailable.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Validate Worker
        working-directory: workers/maison-intelligence
        run: |
          npm test
          npm run check
          npx wrangler deploy --dry-run --config wrangler.private.runtime.jsonc

      - name: Install private Worker secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        working-directory: workers/maison-intelligence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          BRAIN_PROPOSAL_TOKEN: ${{ secrets.MAISON_BRAIN_PROPOSAL_TOKEN }}
          BRAIN_REVIEW_DECISION_TOKEN: ${{ secrets.MAISON_BRAIN_REVIEW_DECISION_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$BRAIN_CONTROL_TOKEN" | npx wrangler secret put BRAIN_CONTROL_TOKEN --config wrangler.private.runtime.jsonc
          case "$RUNTIME_STAGE" in
            proposal_materialization_candidate|human_review_decision_candidate)
              test -n "$BRAIN_PROPOSAL_TOKEN"
              printf '%s' "$BRAIN_PROPOSAL_TOKEN" | npx wrangler secret put BRAIN_PROPOSAL_TOKEN --config wrangler.private.runtime.jsonc
              ;;
          esac
          if [[ "$RUNTIME_STAGE" == "human_review_decision_candidate" ]]; then
            test -n "$BRAIN_REVIEW_DECISION_TOKEN"
            printf '%s' "$BRAIN_REVIEW_DECISION_TOKEN" | npx wrangler secret put BRAIN_REVIEW_DECISION_TOKEN --config wrangler.private.runtime.jsonc
          fi

      - name: Deploy private surface
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.private.runtime.jsonc

      - name: Verify deployed private Brain health
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: python .github/maison-growth/runtime/verify_private_brain_health.py

      - name: Verify deployed private Brain boundary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: python .github/maison-growth/runtime/verify_private_brain_boundary.py "$RUNTIME_STAGE"

      - name: Verify video generation health
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: bash
        env:
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          VIDEO_GENERATION_TOKEN: ${{ secrets.VIDEO_GENERATION_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MAISON_BRAIN_PRIVATE_URL"
          test -n "$VIDEO_GENERATION_TOKEN"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          base="${MAISON_BRAIN_PRIVATE_URL%/}"
          # Normalize either raw credentials or Cloudflare's copied "Header-Name: value" form.
          access_id="$CF_ACCESS_CLIENT_ID"
          access_secret="$CF_ACCESS_CLIENT_SECRET"
          shopt -s nocasematch
          if [[ "$access_id" =~ ^CF-Access-Client-Id:[[:space:]]*(.*)$ ]]; then
            access_id="${BASH_REMATCH[1]}"
          fi
          if [[ "$access_secret" =~ ^CF-Access-Client-Secret:[[:space:]]*(.*)$ ]]; then
            access_secret="${BASH_REMATCH[1]}"
          fi
          shopt -u nocasematch
          body="$(mktemp)"
          ready=0
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              --header "Accept: application/json" \
              --header "User-Agent: MAISON-JF-Brain/1.0" \
              --header "X-Maison-Video-Token: $VIDEO_GENERATION_TOKEN" \
              --header "CF-Access-Client-Id: $access_id" \
              --header "CF-Access-Client-Secret: $access_secret" \
              "$base/internal/video/health")"
            if [[ "$status" == "200" ]] && python - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              payload=json.load(fh)
          providers=payload.get("providers", [])
          ok=(
              payload.get("service") == "maison_short_video"
              and payload.get("enabled") is True
              and payload.get("mode") == "zero_cost_only"
              and payload.get("billing_allowed") is False
              and "wan22-tinchote" not in providers
              and "wan22-aoti-fast" in providers
              and "wan22-r3gm-preview" in providers
          )
          if not ok:
              raise SystemExit(1)
          print("Maison short-video health: OK")
          print("Providers:", ", ".join(providers))
          PY
            then
              ready=1
              break
            fi
            echo "Waiting for current video registry to propagate (attempt $attempt/12)..."
            sleep 5
          done
          if [[ "$ready" != "1" ]]; then
            echo "Video health did not converge to the current provider registry."
            cat "$body"
            exit 1
          fi

      - name: Generate one-second video smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: bash
        env:
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          VIDEO_GENERATION_TOKEN: ${{ secrets.VIDEO_GENERATION_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        id: video_smoke
        run: |
          set -euo pipefail
          base="${MAISON_BRAIN_PRIVATE_URL%/}"
          access_id="$CF_ACCESS_CLIENT_ID"
          access_secret="$CF_ACCESS_CLIENT_SECRET"
          shopt -s nocasematch
          if [[ "$access_id" =~ ^CF-Access-Client-Id:[[:space:]]*(.*)$ ]]; then access_id="${BASH_REMATCH[1]}"; fi
          if [[ "$access_secret" =~ ^CF-Access-Client-Secret:[[:space:]]*(.*)$ ]]; then access_secret="${BASH_REMATCH[1]}"; fi
          shopt -u nocasematch
          payload='{"image_url":"https://maison-jf.com/images/ebooks/posters/casos-cinzentos.webp","prompt":"Subtle cinematic noir motion only: warm desk-lamp flicker, faint drifting atmosphere, gentle parallax across investigation photographs and red strings, distant harbour lights shimmering. Preserve poster composition and typography.","duration_seconds":1,"steps":4,"seed":42,"randomize_seed":false}'
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --request POST \
            --header "Accept: application/json" --header "Content-Type: application/json" \
            --header "X-Maison-Video-Token: $VIDEO_GENERATION_TOKEN" \
            --header "CF-Access-Client-Id: $access_id" --header "CF-Access-Client-Secret: $access_secret" \
            --data "$payload" "$base/internal/video/generate")"
          if [[ "$status" != "202" ]]; then echo "Video smoke test failed with HTTP $status"; cat "$body"; exit 1; fi
          python - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh: p=json.load(fh)
          assert p.get("state") == "queued", p
          assert p.get("cost_mode") == "zero_cost_unauthenticated", p
          assert p.get("billing_allowed") is False, p
          print("Maison one-second video queued successfully")
          print("Provider:", p.get("provider"))
          print("Job ID:", p.get("job_id"))
          print("Result path:", p.get("result_path"))
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"provider={p['provider']}\n")
              out.write(f"job_id={p['job_id']}\n")
          PY

      - name: Collect one-second video result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        shell: bash
        env:
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          VIDEO_GENERATION_TOKEN: ${{ secrets.VIDEO_GENERATION_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
          VIDEO_PROVIDER: ${{ steps.video_smoke.outputs.provider }}
          VIDEO_JOB_ID: ${{ steps.video_smoke.outputs.job_id }}
        run: |
          set -euo pipefail
          base="${MAISON_BRAIN_PRIVATE_URL%/}"
          access_id="$CF_ACCESS_CLIENT_ID"
          access_secret="$CF_ACCESS_CLIENT_SECRET"
          shopt -s nocasematch
          if [[ "$access_id" =~ ^CF-Access-Client-Id:[[:space:]]*(.*)$ ]]; then access_id="${BASH_REMATCH[1]}"; fi
          if [[ "$access_secret" =~ ^CF-Access-Client-Secret:[[:space:]]*(.*)$ ]]; then access_secret="${BASH_REMATCH[1]}"; fi
          shopt -u nocasematch
          result="$(mktemp)"
          curl --fail --silent --show-error \
            --header "Accept: text/event-stream" \
            --header "X-Maison-Video-Token: $VIDEO_GENERATION_TOKEN" \
            --header "CF-Access-Client-Id: $access_id" \
            --header "CF-Access-Client-Secret: $access_secret" \
            "$base/internal/video/result?provider=$VIDEO_PROVIDER&job_id=$VIDEO_JOB_ID" > "$result"
          cat "$result"
          video_url="$(python - "$result" <<'PY'
          import json, re, sys
          text=open(sys.argv[1], encoding="utf-8").read()
          urls=[]
          for line in text.splitlines():
              if line.startswith("data:"):
                  raw=line[5:].strip()
                  try:
                      obj=json.loads(raw)
                      def walk(x):
                          if isinstance(x,dict):
                              for k,v in x.items():
                                  if k in ("url","path") and isinstance(v,str) and v.startswith("http"): urls.append(v)
                                  walk(v)
                          elif isinstance(x,list):
                              for v in x: walk(v)
                      walk(obj)
                  except Exception:
                      urls += re.findall(r'https://[^"\\s]+', raw)
          candidates=[u for u in urls if ".mp4" in u.lower() or "video" in u.lower()]
          if candidates: print(candidates[-1])
          PY
          )"
          test -n "$video_url"
          mkdir -p video-output
          curl --fail --location --silent --show-error "$video_url" --output video-output/casos-cinzentos-smoke-test.mp4
          test -s video-output/casos-cinzentos-smoke-test.mp4
          echo "MP4 collected successfully"

      - name: Upload video smoke-test artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        uses: actions/upload-artifact@v4
        with:
          name: casos-cinzentos-video-smoke-test
          path: video-output/casos-cinzentos-smoke-test.mp4
          if-no-files-found: error
          retention-days: 7
