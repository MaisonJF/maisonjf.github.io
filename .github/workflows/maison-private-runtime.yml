name: Maison Private Runtime
run-name: Maison Private Runtime

on:
  pull_request:
    paths:
      - '.github/maison-growth/**'
      - 'workers/maison-intelligence/**'
      - '.github/workflows/maison-private-runtime.yml'
  push:
    branches:
      - main
    paths:
      - '.github/maison-growth/**'
      - 'workers/maison-intelligence/**'
      - '.github/workflows/maison-private-runtime.yml'
  workflow_dispatch:

concurrency:
  group: maison-private-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  private-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One operator-facing mode: the complete private Brain surface.
      # Public write, outbound, spend and experiment execution remain forbidden.
      RUNTIME_STAGE: human_review_decision_candidate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh derived commercial context
        run: bash .github/maison-growth/brain/rebuild_commercial_context.sh --write

      - name: Validate global health gate
        run: python .github/maison-growth/brain/validate_global_health_gate.py

      - name: Report private runtime readiness
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          MAISON_BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          MAISON_CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          MAISON_CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: python .github/maison-growth/runtime/report_private_runtime_readiness.py

      - name: Guard manual private activation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BRAIN_CONTROL_API_URL"
          test -n "$BRAIN_CONTROL_TOKEN"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"

      - name: Prepare scoped private credentials
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MAISON_BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
        run: python .github/maison-growth/runtime/private_runtime_tokens.py --github-env "$GITHUB_ENV"

      - name: Private runtime preflight
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          BRAIN_PROPOSAL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_REVIEW_DECISION_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: python .github/maison-growth/runtime/preflight_private_runtime.py "$RUNTIME_STAGE"

      - name: Render temporary Wrangler config (dry-run)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python .github/maison-growth/runtime/render_private_worker_config.py             "$RUNTIME_STAGE"             --template workers/maison-intelligence/wrangler.jsonc             --output workers/maison-intelligence/wrangler.private.runtime.jsonc

      - name: Render temporary Wrangler config (live custom domain)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
        run: |
          python .github/maison-growth/runtime/render_private_worker_config.py             "$RUNTIME_STAGE"             --template workers/maison-intelligence/wrangler.jsonc             --private-url "$BRAIN_CONTROL_API_URL"             --output workers/maison-intelligence/wrangler.private.runtime.jsonc

      - name: Install Worker tooling
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts

      - name: Verify remote D1 schema
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Validate Worker
        working-directory: workers/maison-intelligence
        run: |
          npm test
          npm run check
          npx wrangler deploy --dry-run --config wrangler.private.runtime.jsonc

      - name: Deploy complete private surface
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: workers/maison-intelligence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          export MAISON_PRIVATE_SECRETS_FILE="$secrets_file"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          secrets = {
              "BRAIN_CONTROL_TOKEN": os.environ["BRAIN_CONTROL_TOKEN"],
              "BRAIN_PROPOSAL_TOKEN": os.environ["BRAIN_PROPOSAL_TOKEN"],
              "BRAIN_REVIEW_DECISION_TOKEN": os.environ["BRAIN_REVIEW_DECISION_TOKEN"],
          }
          path = Path(os.environ["MAISON_PRIVATE_SECRETS_FILE"])
          path.write_text(json.dumps(secrets), encoding="utf-8")
          path.chmod(0o600)
          print("Prepared one-shot private Worker deployment credentials; values not printed.")
          PY
          npx wrangler deploy             --secrets-file "$secrets_file"             --config wrangler.private.runtime.jsonc

      - name: Verify Worker deployment exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: workers/maison-intelligence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --name maison-intelligence --json > /tmp/maison-private-deployments.json
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/maison-private-deployments.json").read_text(encoding="utf-8"))
          if not isinstance(value, list) or not value:
              raise SystemExit("No active maison-intelligence deployment found after deploy")
          print(f"Confirmed active maison-intelligence deployment count={len(value)}")
          PY

      - name: Verify deployed private Brain health
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if python .github/maison-growth/runtime/verify_private_brain_health.py; then
              exit 0
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Private Brain health did not become ready after retries."
              exit 1
            fi
            echo "Private Brain health not ready yet (attempt $attempt/12); waiting for route/TLS propagation..."
            sleep 5
          done

      - name: Verify two-layer private boundary
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if python .github/maison-growth/runtime/verify_private_brain_boundary.py "$RUNTIME_STAGE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 8 ]]; then
              echo "Private Brain boundary verification failed after retries."
              exit 1
            fi
            echo "Private Brain boundary not ready yet (attempt $attempt/8); retrying..."
            sleep 5
          done

      - name: Run private commercial preview
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
          MAISON_A14_MATERIALIZE_ENABLED: 'false'
          MAISON_SEMANTIC_CONTEXT_ENABLED: 'false'
          MAISON_OSIRIS_CONTEXT_ENABLED: 'false'
        run: python .github/maison-growth/brain/private_commercial_preview.py

      - name: Summarize private activation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          {
            echo "## Maison Private Runtime"
            echo "- Worker deployment: confirmed"
            echo "- D1 schema: verified"
            echo "- Cloudflare Access edge: enforced"
            echo "- Brain bearer boundary: enforced"
            echo "- Brain Control API: healthy/read-only"
            echo "- Proposal surface: enabled, authenticated, no-write probe passed"
            echo "- Human review surface: enabled, authenticated, no-write probe passed"
            echo "- Commercial preview: passed"
            echo "- Public write/outbound/spend/experiment execution: not authorized"
          } >> "$GITHUB_STEP_SUMMARY"
