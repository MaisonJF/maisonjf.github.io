name: Unify Oracle territory presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flatten-oracle-territories.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Give every Oracle territory the same visual hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('oraculo/index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Remove the special visual tier for the six former "central" territories.
          text = text.replace('.oracle__central{margin:34px 0 48px}.oracle__central h2{font:400 34px/1.1 var(--serif);margin:0 0 20px;text-align:left}\n', '')
          text = text.replace('.oracle-group{border-top:1px solid var(--line);text-align:left}.oracle-group:last-of-type{border-bottom:1px solid var(--line)}\n', '.oracle-group{border-top:1px solid var(--line);text-align:left}\n')
          text = text.replace('.oracle-group summary{list-style:none;cursor:pointer;padding:24px 2px;font:400 30px/1.1 var(--serif);display:flex;justify-content:space-between;align-items:center}\n', '.oracle-group summary{list-style:none;cursor:default;padding:24px 2px;font:400 30px/1.1 var(--serif);display:flex;justify-content:space-between;align-items:center}\n')
          text = text.replace('@media(max-width:700px){.oracle{padding:115px 14px 70px}.oracle-group summary{font-size:25px;padding:20px 2px}.oracle__central{margin-top:28px}.oracle__central h2{font-size:29px}}', '@media(max-width:700px){.oracle{padding:115px 14px 70px}.oracle-group summary{font-size:25px;padding:20px 2px}}')

          # Turn the former central block into the first ordinary group.
          m = re.search(r'<section class="oracle__central"><h2>Territórios centrais</h2><div class="territory-grid">(.*?)</div></section>\n<section id="oracle-groups">', text, re.S)
          if not m:
              raise SystemExit('Expected central territory block not found; refusing unrelated edit.')
          central_cards = m.group(1)
          replacement = '<section id="oracle-groups"><details class="oracle-group" open><summary>Amor, Trabalho &amp; Vida Prática</summary><div class="territory-grid">' + central_cards + '</div></details>\n'
          text = text[:m.start()] + replacement + text[m.end():]

          # All groups remain visible: same cards, same hierarchy, no accordion/cascade behaviour.
          text = text.replace('<details class="oracle-group">', '<details class="oracle-group" open>')
          text = text.replace(" groups.forEach(group=>{const visible=[...group.querySelectorAll('.oracle-card')].some(c=>!c.hidden);group.hidden=!visible;if(q&&visible)group.open=true});", " groups.forEach(group=>{const visible=[...group.querySelectorAll('.oracle-card')].some(c=>!c.hidden);group.hidden=!visible;group.open=true});")
          text = text.replace("search.addEventListener('search',apply);apply();", "groups.forEach(group=>group.addEventListener('toggle',()=>{if(!group.open)group.open=true}));search.addEventListener('search',apply);apply();")

          if text == original:
              raise SystemExit('No Oracle presentation change produced.')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add oraculo/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify Oracle territory visual hierarchy'
          git push
