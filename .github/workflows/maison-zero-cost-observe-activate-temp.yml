name: Maison Zero Cost Observe Activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maison-zero-cost-observe-activate-temp.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate zero-cost runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cfg=json.loads(Path("workers/maison-intelligence/wrangler.jsonc").read_text())
          v=cfg["vars"]

          assert v["WORKER_ENABLED"]=="true"
          assert v["KILL_SWITCH"]=="false"
          assert v["ZERO_COST_MODE"]=="true"
          assert v["OPENROUTER_ENABLED"]=="true"
          assert v["OSIRIS_ENABLED"]=="true"
          assert v["MAX_DAILY_CALLS_PER_PROVIDER"]=="1"
          assert v["MAX_DAILY_CALLS_PER_OSIRIS_SOURCE"]=="1"
          assert cfg["triggers"]["crons"]==["17 0 * * *"]

          for key in (
              "WORKERS_AI_ENABLED","OSIRIS_GATEWAY_ENABLED","OPENAI_ENABLED",
              "GEMINI_ENABLED","PERPLEXITY_ENABLED","ANTHROPIC_ENABLED"
          ):
              assert v[key]=="false", key

          models=[v["OPENROUTER_MODEL"], *json.loads(v["OPENROUTER_FALLBACK_MODELS_JSON"])]
          assert models and all(m.endswith(":free") for m in models)

          cadences=json.loads(v["OSIRIS_SOURCE_CADENCES_JSON"])
          assert len(cadences)==24
          assert set(cadences.values())=={24}

          print(json.dumps({
              "zero_cost_contract":"ok",
              "free_models":len(models),
              "osiris_sources":len(cadences),
              "cron":cfg["triggers"]["crons"][0]
          }, sort_keys=True))
          PY

      - name: Test OpenRouter key against allowed free models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          key=(os.environ.get("OPENROUTER_API_KEY") or "").strip()
          if not key:
              raise SystemExit("OPENROUTER_API_KEY missing")

          cfg=json.loads(Path("workers/maison-intelligence/wrangler.jsonc").read_text())
          v=cfg["vars"]
          models=[v["OPENROUTER_MODEL"], *json.loads(v["OPENROUTER_FALLBACK_MODELS_JSON"])]

          errors=[]
          for model in models:
              body=json.dumps({
                  "model":model,
                  "messages":[{"role":"user","content":"Reply with the single word OK."}],
                  "max_tokens":16,
                  "temperature":0,
                  "provider":{
                      "allow_fallbacks":False,
                      "max_price":{"prompt":0,"completion":0}
                  }
              }).encode()

              req=urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=body,
                  headers={
                      "Authorization":"Bearer "+key,
                      "Content-Type":"application/json",
                      "HTTP-Referer":"https://maison-jf.com",
                      "X-OpenRouter-Title":"MAISON JF Intelligence"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      data=json.load(r)
                  print(json.dumps({
                      "openrouter_test":"ok",
                      "requested_model":model,
                      "returned_model":str(data.get("model") or ""),
                      "has_response":bool((data.get("choices") or []))
                  }, sort_keys=True))
                  break
              except urllib.error.HTTPError as e:
                  errors.append({"model":model,"http":e.code})
                  print(json.dumps({"model":model,"http":e.code,"retrying_free_fallback":True},sort_keys=True))
          else:
              raise SystemExit("all_allowed_free_models_failed: "+json.dumps(errors))
          PY

      - name: Render zero-cost live Worker config
        env:
          MAISON_BRAIN_PRIVATE_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse

          src=Path("workers/maison-intelligence/wrangler.jsonc")
          cfg=json.loads(src.read_text())
          host=urlparse(os.environ["MAISON_BRAIN_PRIVATE_URL"].strip()).hostname
          if not host:
              raise SystemExit("invalid private URL")

          cfg["routes"]=[{"pattern":host,"custom_domain":True}]
          cfg.pop("ai",None)
          Path("workers/maison-intelligence/wrangler.zero-cost.runtime.jsonc").write_text(
              json.dumps(cfg,indent=2)+"\n"
          )
          print(json.dumps({"custom_domain":host,"workers_ai_binding":False}))
          PY

      - name: Install Worker tooling
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts

      - name: Deploy zero-cost observe runtime
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.zero-cost.runtime.jsonc

      - name: Install zero-cost runtime secrets
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          test -n "$BRAIN_CONTROL_TOKEN"
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY --config wrangler.zero-cost.runtime.jsonc
          printf '%s' "$BRAIN_CONTROL_TOKEN" | npx wrangler secret put BRAIN_CONTROL_TOKEN --config wrangler.zero-cost.runtime.jsonc

      - name: Verify D1 observe gate read-only
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute maison-growth-engine --remote --command "SELECT control_id, kill_switch, observe_only FROM external_intelligence_control WHERE control_id='global';"

      - name: Verify private Brain remains reachable
        env:
          BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
          BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN || secrets.BRAIN_CONTROL_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
        run: python .github/maison-growth/runtime/verify_private_brain_health.py
