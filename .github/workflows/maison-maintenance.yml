name: Maison Maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Authorised maintenance operation
        required: true
        type: choice
        options:
          - apply_b2b_seed_0017
          - apply_b2b_feedback_0018
          - apply_commercial_recovery_0021
          - apply_content_learning_a11_0019_0020
          - apply_vault_localizer_telemetry_0004
          - rebuild_commercial_context
          - validate_global_health
      confirm_write:
        description: Confirm write operation when applicable
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply canonical Maison B2B solution seed 0017
        if: ${{ inputs.operation == 'apply_b2b_seed_0017' }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_write }}" = "true"
          npm install --ignore-scripts
          SQL="$(sed '/^[[:space:]]*--/d' ../../.github/maison-growth/a3/migrations/0017_b2b_canonical_solution.sql)"
          test -n "$SQL"
          npx wrangler d1 execute maison-growth-engine --remote --command="$SQL"
          bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Apply reviewed B2B feedback migration 0018
        if: ${{ inputs.operation == 'apply_b2b_feedback_0018' }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_write }}" = "true"
          npm install --ignore-scripts
          SQL="$(sed '/^[[:space:]]*--/d' ../../.github/maison-growth/brain/migrations/0018_b2b_feedback.sql)"
          test -n "$SQL"
          npx wrangler d1 execute maison-growth-engine --remote --command="$SQL"
          bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Apply reviewed A11.2 content learning migrations 0019 and 0020
        if: ${{ inputs.operation == 'apply_content_learning_a11_0019_0020' }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_write }}" = "true"
          npm install --ignore-scripts
          for migration in \
            ../../.github/maison-growth/a11/migrations/0019_content_learning_source.sql \
            ../../.github/maison-growth/a11/migrations/0020_learning_rule_seed.sql; do
            # D1 remote rejects client-issued BEGIN/COMMIT and PRAGMA statements.
            # Preserve every schema and seed statement from the reviewed migration.
            SQL="$(sed -E '/^[[:space:]]*--/d; /^[[:space:]]*(PRAGMA foreign_keys|BEGIN IMMEDIATE|COMMIT)/d' "$migration")"
            test -n "$SQL"
            npx wrangler d1 execute maison-growth-engine --remote --command="$SQL"
          done
          bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Apply reviewed commercial recovery migration 0021
        if: ${{ inputs.operation == 'apply_commercial_recovery_0021' }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_write }}" = "true"
          npm install --ignore-scripts
          SQL="$(sed '/^[[:space:]]*--/d' ../../.github/maison-growth/brain/migrations/0021_commercial_recovery_journal.sql)"
          test -n "$SQL"
          npx wrangler d1 execute maison-growth-engine --remote --command="$SQL"
          bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Apply Vault localizer telemetry migration 0004
        if: ${{ inputs.operation == 'apply_vault_localizer_telemetry_0004' }}
        working-directory: workers/maison-intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_write }}" = "true"
          npm install --ignore-scripts
          SQL="$(sed -E '/^[[:space:]]*--/d; /^[[:space:]]*PRAGMA foreign_keys/d' ../../.github/maison-growth/vault/0004_localizer_telemetry.sql)"
          test -n "$SQL"
          npx wrangler d1 execute maison-growth-engine --remote --command="$SQL"
          npx wrangler d1 execute maison-growth-engine --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name='vault_localizer_telemetry';"

      - name: Rebuild commercial context
        if: ${{ inputs.operation == 'rebuild_commercial_context' }}
        run: |
          set -euo pipefail
          bash .github/maison-growth/brain/rebuild_commercial_context.sh --write
          bash .github/maison-growth/brain/rebuild_commercial_context.sh --check

      - name: Validate global health
        if: ${{ inputs.operation == 'validate_global_health' }}
        run: python .github/maison-growth/brain/validate_global_health_gate.py
