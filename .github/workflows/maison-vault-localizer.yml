name: Maison Vault Localizer

on:
  pull_request:
    paths:
      - 'workers/maison-vault-localizer/**'
      - '.github/workflows/maison-vault-localizer.yml'
  push:
    branches:
      - main
    paths:
      - 'workers/maison-vault-localizer/**'
      - '.github/workflows/maison-vault-localizer.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate localizer syntax
        run: node --check workers/maison-vault-localizer/src/index.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts
      - name: Validate Worker bundle
        working-directory: workers/maison-intelligence
        run: npx wrangler deploy --dry-run --config ../maison-vault-localizer/wrangler.jsonc

  deploy-production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts
      - name: Deploy production localizer
        working-directory: workers/maison-intelligence
        run: npx wrangler deploy --config ../maison-vault-localizer/wrangler.jsonc
      - name: Report direct Vault localization pending counts
        working-directory: workers/maison-intelligence
        run: |
          npx wrangler d1 execute maison-growth-engine --remote --command="SELECT l.locale, COUNT(*) AS pending_questions FROM (SELECT 'pt-BR' locale UNION ALL SELECT 'en' UNION ALL SELECT 'es') l JOIN vault_questions q ON q.status='active' AND q.exposure='paid' AND q.lifecycle_state='live' AND q.rotation_state IN ('new','limited','normal') LEFT JOIN vault_question_translations t ON t.question_id=q.question_id AND t.locale=l.locale AND t.status='active' WHERE t.question_id IS NULL GROUP BY l.locale ORDER BY l.locale;"
          npx wrangler d1 execute maison-growth-engine --remote --command="SELECT l.locale, COUNT(*) AS pending_oracle FROM (SELECT 'pt-BR' locale UNION ALL SELECT 'en' UNION ALL SELECT 'es') l JOIN vault_oracle_blocks b ON b.status='active' AND b.lifecycle_state='live' AND b.rotation_state IN ('new','limited','normal') LEFT JOIN vault_oracle_block_translations t ON t.block_id=b.block_id AND t.locale=l.locale AND t.status='active' WHERE t.block_id IS NULL GROUP BY l.locale ORDER BY l.locale;"
          npx wrangler d1 execute maison-growth-engine --remote --command="SELECT l.locale, COALESCE(t.status,'MISSING') AS translation_status, COUNT(*) AS count FROM (SELECT 'pt-BR' locale UNION ALL SELECT 'en' UNION ALL SELECT 'es') l JOIN vault_questions q ON q.status='active' AND q.exposure='paid' AND q.lifecycle_state='live' AND q.rotation_state IN ('new','limited','normal') LEFT JOIN vault_question_translations t ON t.question_id=q.question_id AND t.locale=l.locale WHERE t.status IS NULL OR t.status<>'active' GROUP BY l.locale,COALESCE(t.status,'MISSING') ORDER BY l.locale,translation_status;"
