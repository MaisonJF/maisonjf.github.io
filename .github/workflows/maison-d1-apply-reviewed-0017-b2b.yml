name: Maison D1 Apply Reviewed 0017 B2B

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Apply reviewed 0017 canonical B2B A3 solution mapping
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apply-reviewed-b2b-seed:
    if: ${{ inputs.confirm_apply }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard dedicated D1 write credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Worker tooling
        working-directory: workers/maison-intelligence
        run: npm install --ignore-scripts

      - name: Apply reviewed 0017 B2B solution mapping
        working-directory: workers/maison-intelligence
        run: bash scripts/apply-reviewed-0017-b2b.sh maison-growth-engine --confirm-reviewed-0017-b2b

      - name: Verify runtime schema and B2B solution
        working-directory: workers/maison-intelligence
        run: |
          bash scripts/inspect-growth-migrations.sh maison-growth-engine
          bash scripts/verify-growth-schema.sh maison-growth-engine

      - name: Summarize controlled B2B seed
        shell: bash
        run: |
          {
            echo "## Maison D1 reviewed B2B solution seed"
            echo
            echo "- Database: maison-growth-engine"
            echo "- Applied: 0017 data-only canonical B2B A3 solution mapping"
            echo "- Worker deployed: false"
            echo "- External collection activated: false"
            echo "- Outbound authority enabled: false"
            echo "- Spend authority enabled: false"
          } >> "$GITHUB_STEP_SUMMARY"
