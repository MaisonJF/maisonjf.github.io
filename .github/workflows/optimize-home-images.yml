name: Optimize homepage images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-home-images.yml'

permissions:
  contents: write

jobs:
  optimize-home-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build responsive WebP variants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          jobs = {
              'images/maison-jf-hero-hq.jpg': ('hero', [640, 960, 1280, 1672], 82),
              'images/maison-jf-casa-amigos-hq.jpg': ('casa', [480, 768, 1080], 80),
              'images/maison-jf-corpo-homem-hq.jpg': ('corpo', [480, 768, 1080], 80),
              'images/cabeca-mulher-q94.jpg': ('cabeca', [480, 768, 1080], 80),
              'images/maison-jf-companhia-hq.jpg': ('presenca', [480, 768, 1080], 80),
              'images/maison-jf-b2b-office-hq.jpg': ('b2b', [640, 960, 1280], 80),
          }

          out = Path('images/perf/home')
          out.mkdir(parents=True, exist_ok=True)

          for src, (name, widths, quality) in jobs.items():
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  ow, oh = im.size
                  for width in widths:
                      width = min(width, ow)
                      height = round(oh * width / ow)
                      target = out / f'{name}-{width}.webp'
                      if width == ow:
                          resized = im
                      else:
                          resized = im.resize((width, height), Image.Resampling.LANCZOS)
                      resized.save(target, 'WEBP', quality=quality, method=6, optimize=True)
                      print(f'{target}: {width}x{height} · {target.stat().st_size/1024:.1f} KB')
          PY

      - name: Commit optimized images
        shell: bash
        run: |
          if git diff --quiet -- images/perf/home && [ -z "$(git ls-files --others --exclude-standard images/perf/home)" ]; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/perf/home
          git commit -m "Gera imagens responsivas WebP para a homepage"
          git push
