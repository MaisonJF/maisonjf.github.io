name: Maison Brain Guard

on:
  pull_request:
    paths:
      - '.github/maison-growth/**'
      - 'workers/maison-intelligence/**'
      - 'data/products.js'
      - 'data/services.js'
      - 'functions/_lib/commerce-events.js'
      - 'functions/api/b2b-lead.js'
      - '.github/workflows/maison-brain-guard.yml'
  push:
    branches:
      - main
    paths:
      - '.github/maison-growth/**'
      - 'workers/maison-intelligence/**'
      - 'data/products.js'
      - 'data/services.js'
      - '.github/workflows/maison-brain-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate supporting Growth organs
        shell: bash
        run: |
          set -euo pipefail
          for module in a1 a3 a4 a5 a7 a8 a9 a10 a11 a12 a13; do
            python ".github/maison-growth/${module}/validate_${module}.py"
          done

      - name: Validate A14 commercial brain
        run: python .github/maison-growth/a14/validate_a14.py

      - name: Check all derived commercial context
        run: bash .github/maison-growth/brain/rebuild_commercial_context.sh --check

      - name: Validate Brain contracts and schema chain
        run: python .github/maison-growth/brain/validate_brain_runtime.py

      - name: Validate canonical B2B feedback loop
        run: |
          python .github/maison-growth/brain/validate_b2b_feedback_loop.py
          node --check functions/_lib/commerce-events.js
          node --check functions/api/b2b-lead.js

      - name: Validate persistent observe runtime contracts
        run: python .github/maison-growth/runtime/validate_runtime.py

      - name: Validate Docker Compose expansion without starting services
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          MAISON_OSIRIS_BRIDGE_TOKEN: ci-only-not-a-secret
          BRAIN_CONTROL_API_URL: http://maison-intelligence
          BRAIN_CONTROL_TOKEN: ci-only-not-a-secret
          BRAIN_PROPOSAL_API_URL: http://maison-intelligence
          BRAIN_PROPOSAL_TOKEN: ci-only-not-a-secret
        run: |
          docker compose \
            -f .github/maison-growth/runtime/docker-compose.observe.yml \
            config --quiet
          docker compose \
            -f .github/maison-growth/runtime/docker-compose.observe.yml \
            config --profiles

      - name: Check A13 worker JavaScript
        working-directory: workers/maison-intelligence
        run: npm run check

      - name: Test A13 worker
        working-directory: workers/maison-intelligence
        run: npm test
