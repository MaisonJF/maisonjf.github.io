name: Maison JF Oceans Daily Brief Watchdog
run-name: Maison JF Oceans Daily Brief Watchdog

on:
  schedule:
    # Recovery checkpoint after 08:30 Lisbon: 07:30 UTC in summer, 08:30 UTC in winter.
    # The script tolerates delayed cron execution and only skips runs before 08:30 local.
    - cron: '30 7,8 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: maison-oceans-daily-brief-watchdog
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether today's briefing was actually sent
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_HOUR="$(TZ=Europe/Lisbon date +%H)"
          LOCAL_MINUTE="$(TZ=Europe/Lisbon date +%M)"
          # Run only after the intended 08:30 Lisbon checkpoint, but tolerate
          # GitHub's delayed cron execution rather than requiring an exact hour.
          if [ "$LOCAL_HOUR" -lt 8 ] || { [ "$LOCAL_HOUR" -eq 8 ] && [ "$LOCAL_MINUTE" -lt 30 ]; }; then
            echo "Before the 08:30 Lisbon recovery checkpoint; skipping this schedule entry."
            echo "sent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY="$(TZ=Europe/Lisbon date +%F)"
          YESTERDAY="$(TZ=Europe/Lisbon date -d 'yesterday' +%F)"
          # Include the previous local date because a delayed GitHub run can start
          # after midnight even when its scheduled event was created the day before.
          RUN_IDS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/oceans-daily-brief.yml/runs" -f per_page=100 -f created=">=$YESTERDAY" --jq '.workflow_runs[] | select(.conclusion == "success") | .id')"
          SENT=false
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            LOG="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null || true)"
            if grep -Fq "Daily briefing accepted by Resend" <<< "$LOG" && grep -Fq "\"date\":\"$TODAY\"" <<< "$LOG"; then
              SENT=true
              echo "Found Resend acceptance for local date $TODAY in run $RUN_ID."
              break
            fi
          done <<< "$RUN_IDS"
          echo "sent=$SENT" >> "$GITHUB_OUTPUT"
          if [ "$SENT" = true ]; then
            echo "Today's briefing has already been accepted by Resend; no recovery send needed."
          else
            echo "No successful send marker found for $TODAY; recovery dispatch required."
          fi

      - name: Trigger recovery send if the morning send is missing
        if: steps.check.outputs.sent != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run oceans-daily-brief.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          echo "Recovery run dispatched. Check the Oceans Daily Brief workflow logs for the Resend result."
