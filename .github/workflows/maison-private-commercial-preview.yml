name: Maison Private Commercial Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRAIN_CONTROL_API_URL: ${{ secrets.MAISON_BRAIN_PRIVATE_URL }}
      BRAIN_CONTROL_TOKEN: ${{ secrets.MAISON_BRAIN_CONTROL_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.MAISON_CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.MAISON_CF_ACCESS_CLIENT_SECRET }}
      MAISON_A14_MATERIALIZE_ENABLED: 'false'
      MAISON_SEMANTIC_CONTEXT_ENABLED: 'false'
      MAISON_OSIRIS_CONTEXT_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify required private preview secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in BRAIN_CONTROL_API_URL BRAIN_CONTROL_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret/env: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Private preview is skipped because required secrets are not configured for this repository or environment."
            echo "Add MAISON_BRAIN_PRIVATE_URL, MAISON_BRAIN_CONTROL_TOKEN, MAISON_CF_ACCESS_CLIENT_ID, and MAISON_CF_ACCESS_CLIENT_SECRET to the repository or environment secrets."
            exit 0
          fi

      - name: Preflight private read surface
        run: python .github/maison-growth/runtime/preflight_private_runtime.py private_brain_read_candidate

      - name: Verify private Brain health
        run: python .github/maison-growth/runtime/verify_private_brain_health.py

      - name: Run identifier-free commercial preview
        run: python .github/maison-growth/brain/private_commercial_preview.py
