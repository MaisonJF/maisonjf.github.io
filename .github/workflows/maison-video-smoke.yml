name: Maison Video Smoke Test
run-name: Maison Video Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/maison-video-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official Gradio client
        run: python -m pip install --disable-pip-version-check --quiet gradio_client

      - name: Generate one-second Casos Cinzentos MP4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from gradio_client import Client, handle_file

          source = "https://maison-jf.com/images/ebooks/posters/casos_cinzentos_poster.webp"
          prompt = (
              "Subtle cinematic noir motion only: warm desk-lamp flicker, faint drifting atmosphere, "
              "gentle parallax across investigation photographs and red strings, distant harbour lights "
              "shimmering. Preserve poster composition and typography."
          )
          negative = "low quality, blurry, distorted, deformed, static frame, text artifacts, watermark"

          # Use Gradio's official client so upload, queue protocol, FileData handling,
          # result streaming, and output download are handled by the provider's own API client.
          client = Client(
              "zerogpu-aoti/wan2-2-fp8da-aoti-faster",
              download_files=True,
              verbose=False,
          )
          result = client.predict(
              handle_file(source),
              prompt,
              4,
              negative,
              1.0,
              1.0,
              1.0,
              42,
              False,
              api_name="/generate_video",
          )

          print("Gradio result type:", type(result).__name__)
          print("Gradio result:", result)

          candidates = []
          def walk(value):
              if isinstance(value, str):
                  if value.lower().endswith(".mp4") and os.path.exists(value):
                      candidates.append(value)
              elif isinstance(value, dict):
                  for v in value.values():
                      walk(v)
              elif isinstance(value, (list, tuple)):
                  for v in value:
                      walk(v)

          walk(result)
          if not candidates:
              raise RuntimeError("No downloaded MP4 returned by Gradio client")

          out = Path("video-output/casos-cinzentos-smoke-test.mp4")
          out.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(candidates[0], out)
          if out.stat().st_size <= 0:
              raise RuntimeError("Generated MP4 is empty")
          print(f"MP4 ready: {out} ({out.stat().st_size} bytes)")
          PY

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: casos-cinzentos-video-smoke-test
          path: video-output/casos-cinzentos-smoke-test.mp4
          if-no-files-found: error
          retention-days: 7
