<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>A tua leitura | Oráculo MAISON JF®</title><link rel="stylesheet" href="../../maison.css"><style>main{min-height:100svh;display:grid;place-items:center;padding:120px 22px 70px;background:#12100f;color:#eee;text-align:center}.wrap{max-width:720px}h1{font:400 clamp(38px,8vw,70px)/1.1 Georgia,serif}#reading{font:clamp(20px,3.5vw,28px)/1.55 Georgia,serif;white-space:pre-line;margin:36px auto}.note{opacity:.7;font-size:13px;line-height:1.6}.hidden{display:none}</style><link rel="stylesheet" href="/maison-noir-global.css?v=20261108-global" /></head>
<body><header class="site-header"><a class="brand" href="../../">MAISON JF®</a></header><main><div class="wrap"><p>ORÁCULO MAISON JF®</p><h1 id="heading">A tua leitura.</h1><p id="reading" role="status" aria-live="polite">A confirmar a tua sessão…</p><p class="note">Leitura simbólica para reflexão. Não é uma previsão nem uma garantia de acontecimentos.</p><a href="../">Voltar ao Oráculo</a></div></main>
<script>
(async()=>{'use strict';const params=new URLSearchParams(location.search),id=params.get('session_id'),locale=params.get('locale')||'pt-PT',output=document.getElementById('reading');if(!id||!/^cs_live_[A-Za-z0-9]+$/.test(id)){output.textContent='Esta página só apresenta leituras associadas a um pagamento confirmado.';return;}try{const response=await fetch('/api/oracle-reading-live?'+new URLSearchParams({session_id:id,locale}),{cache:'no-store'});const data=await response.json();if(!response.ok||!data.paid||!data.reading?.text)throw Error(data.error||'Não foi possível recuperar a leitura.');const reading=data.reading;document.getElementById('heading').textContent=reading.title||'A tua leitura.';output.textContent=reading.text;}catch(error){output.textContent=error.message||'Não foi possível recuperar a leitura. Tenta novamente mais tarde.';}})();
</script></body></html>
